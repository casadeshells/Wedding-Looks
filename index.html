<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bako &amp; Made, Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EFF0; --mat:#FFFFFF; --ink:#221C22; --muted:#7A7178; --line:#DDD6DA;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --gold:#A8854F; --tape:rgba(214,196,160,.62);
  --shadow:0 1px 2px rgba(34,28,34,.06),0 8px 24px -12px rgba(34,28,34,.18);
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:300 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:32px 22px 22px;border-right:1px solid var(--line)}
.mark{font-family:var(--display);font-size:38px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.mark-sub{color:var(--muted);font-size:13px;margin:0 0 30px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 10px;border-radius:6px;font-size:15px}
.nav button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.nav button[aria-current="true"]{background:var(--mat);box-shadow:var(--shadow);font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.nav .sum{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav .sep{height:1px;background:var(--line);margin:12px 6px}
.side-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.grand-label{color:var(--muted);font-size:13px}
.grand{font-family:var(--display);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;word-break:break-word}
.foot-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cur{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.cur select{background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 6px}

/* Main */
main{padding:44px clamp(18px,4vw,56px) 80px;min-width:0;position:relative}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,84px);line-height:.95;margin:0;letter-spacing:-.005em}
.head .meta{color:var(--muted);font-size:14px;margin-top:10px}
.note{max-width:62ch;margin:18px 0 0;padding-left:14px;border-left:2px solid var(--c);color:var(--muted);font-size:15px}
.note b{font-weight:500;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:400}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:#B4413C}
.btn:disabled{opacity:.45;cursor:default}

/* Board (collage) */
.board{columns:3 250px;column-gap:28px}
.look{break-inside:avoid;margin:0 0 34px;display:block;width:100%;text-align:left;background:none;border:0;padding:0;transform:rotate(var(--tilt,0deg));transition:transform .25s ease}
.look:hover,.look:focus-visible{transform:rotate(0deg)}
.mat{position:relative;background:var(--mat);padding:12px 12px 14px;box-shadow:var(--shadow)}
.tape{position:absolute;top:-9px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(var(--tape,-3deg));background:var(--tape);backdrop-filter:blur(1px);z-index:2}
.photo{aspect-ratio:var(--ar,4/5);background:color-mix(in srgb,var(--c) 18%,var(--paper));overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.strip{display:flex;gap:6px;margin-top:8px}
.strip figure{margin:0;position:relative;width:52px}
.strip img{width:52px;height:52px;object-fit:cover}
.strip figcaption{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagsel{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 2px;border-radius:3px;border:0;background:var(--mat);max-width:70%}
.tagtxt{position:absolute;top:4px;right:4px;font-size:11px;background:var(--mat);padding:1px 6px;border-radius:3px}
.cap{padding:12px 2px 0}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cap h3{margin:0;font-weight:400;font-size:17px;line-height:1.3}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.swatches{display:flex;gap:5px;margin:8px 0 2px;flex-wrap:wrap}
.sw{width:16px;height:16px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lines{margin:8px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.5}
.lines li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lines span{color:var(--muted)}
.cap-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.status{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status[data-s="Chosen"]{border-color:var(--gold);color:var(--gold)}
.status[data-s="Sourcing"]{border-color:var(--ink);color:var(--ink)}
.status[data-s="Ready"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.slot{break-inside:avoid;margin:0 0 34px;width:100%;border:1.5px dashed var(--line);background:transparent;aspect-ratio:4/5;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.slot strong{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}
.slot:hover{border-color:var(--ink)}

.empty{border:1.5px dashed var(--line);padding:56px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px}

.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 82%,transparent);display:none;place-items:center;z-index:40;pointer-events:none}
.drop.on{display:grid}
.drop div{font-family:var(--display);font-size:40px;border:2px dashed var(--ink);padding:40px 60px;background:var(--mat)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,15,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:60;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.dr-head span{color:var(--muted);font-size:13px}
.dr-body{overflow-y:auto;padding:20px 22px 40px;flex:1}
.field{margin-bottom:18px}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in,textarea.in,select.in{width:100%;background:var(--mat);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-weight:300}
textarea.in{min-height:64px;resize:vertical;line-height:1.45}
.title-in{font-family:var(--display);font-size:30px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;background:var(--mat);overflow:hidden}
.imgs figure img{width:100%;height:100%;object-fit:cover}
.imgs figure .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.imgs figure .ctl button{background:none;border:0;color:#fff;font-size:12px;padding:2px 4px}
.imgs figure.cover::after{content:"Cover";position:absolute;top:4px;left:4px;font-size:11px;background:var(--mat);padding:1px 6px;border-radius:3px}
.imgs .add{border:1.5px dashed var(--line);background:transparent;aspect-ratio:1;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:3px 6px 3px 4px;font-size:12px}
.chip .sw{width:18px;height:18px}
.chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:14px;line-height:1}
.picker{display:flex;align-items:center;gap:6px}
.picker input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;overflow:hidden}
.costs{display:flex;flex-direction:column;gap:8px}
.cost{display:grid;grid-template-columns:1fr 130px 28px;gap:8px;align-items:center}
.cost .x{border:0;background:none;color:var(--muted);font-size:18px}
.cost-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.cost-total b{font-family:var(--display);font-weight:400;font-size:26px}
.dr-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

/* Summary */
.big{font-family:var(--display);font-size:clamp(52px,9vw,110px);line-height:1;margin:6px 0 30px;font-variant-numeric:tabular-nums;word-break:break-word}
.bars{display:flex;flex-direction:column;gap:18px;max-width:760px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:16px;align-items:center;font-size:15px}
.bar{height:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.bar-row .amt{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.sub-h{font-family:var(--display);font-weight:400;font-size:30px;margin:52px 0 16px}
.splits{display:flex;flex-wrap:wrap;gap:14px}
.split{background:var(--mat);box-shadow:var(--shadow);padding:16px 20px;min-width:150px}
.split span{display:block;color:var(--muted);font-size:13px}
.split b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;max-width:900px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:400;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td button{background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.banner{background:var(--mat);border:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:24px;max-width:760px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Palette, dates */
.pal{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.pchip{position:relative;width:76px;font-size:12px;line-height:1.3}
.psw{display:block;width:76px;height:76px;border-radius:4px;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);margin-bottom:6px}
.pname{display:block}.phex{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
.prm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--mat);font-size:14px;line-height:1;opacity:0;transition:opacity .15s}
.pchip:hover .prm,.prm:focus-visible{opacity:1}
@media (hover:none){.prm{opacity:.9}}
.padd{display:flex;flex-direction:column;gap:6px;width:150px}
.padd input[type=color]{width:76px;height:76px;border:1.5px dashed var(--line);border-radius:4px;padding:4px;background:transparent;cursor:pointer}
.padd .in{padding:6px 9px;font-size:13px}
.muted{color:var(--muted);font-size:14px}
.chmeta{display:grid;grid-template-columns:200px 1fr;gap:20px 48px;margin:-8px 0 40px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin:0 0 10px}
.date-in{max-width:200px}
.sub-h.first{margin-top:0}
.ov{margin-bottom:48px;max-width:900px}
.date-row{display:grid;grid-template-columns:12px minmax(140px,1fr) 180px minmax(60px,auto) 120px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.date-row .amt{text-align:right;font-variant-numeric:tabular-nums}
.mini-pal{display:flex;gap:4px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:400}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.sub-h.sm{font-size:22px;margin-top:40px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:760px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:640px){.chmeta{grid-template-columns:1fr}.date-row{grid-template-columns:12px 1fr auto;row-gap:8px}.date-row .date-in{grid-column:2/4;max-width:none}.date-row .mini-pal{grid-column:2}.date-row .amt{grid-column:3}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;background:var(--paper);border-right:0;border-bottom:1px solid var(--line);padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .mark{font-size:28px}.mark-sub{display:none}
  .side-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin-top:10px;scrollbar-width:none}
  .nav li{flex:0 0 auto}
  .nav button{grid-template-columns:10px auto;padding:7px 12px;white-space:nowrap}
  .nav .sum,.nav .sep{display:none}
  .side-foot{margin:0;padding:0;border:0;text-align:right}
  .grand{font-size:22px}.cur{justify-content:flex-end;margin-top:2px}
  .grand-label{display:none}
  main{padding-top:28px}
}
@media (min-width:861px){.side-top{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.look{transform:none}.vcard:hover{transform:none}}

/* Home */
.hero{margin-bottom:38px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,92px);line-height:.95;margin:0}
.hero p{color:var(--muted);margin:10px 0 0;font-size:16px}
.hero .when{margin-top:18px;font-size:15px;color:var(--muted)}
.hero .when b{font-weight:400;font-family:var(--display);font-size:22px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px;margin-bottom:38px}
.tile{text-align:left;background:var(--mat);border:0;box-shadow:var(--shadow);padding:18px 20px 20px;display:flex;flex-direction:column;gap:5px;border-top:3px solid var(--c);transition:transform .2s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-2px)}
.tile h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.tile .big-n{font-family:var(--display);font-size:33px;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-word}
.tile .sub{color:var(--muted);font-size:13px;line-height:1.5}
.exports{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:22px;border-top:1px solid var(--line)}
.exports .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.nocost{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:10px;cursor:pointer}
.nocost input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* Total costs */
.mrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);max-width:760px}
.mrow .amt{font-variant-numeric:tabular-nums;font-size:17px}
.mrow.total{border-bottom:0;border-top:2px solid var(--ink)}
.mrow.total .amt{font-family:var(--display);font-size:26px}
.mrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:760px;margin:22px 0 10px}
.mbar i{display:block;height:100%}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr;gap:12px}.tile{padding:14px 15px 16px}.tile .big-n{font-size:27px}}
@media (max-width:430px){.tiles{grid-template-columns:1fr}}

/* Panels */
.panels{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.panels button{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;font-family:var(--display);font-size:19px;line-height:1.2;letter-spacing:.01em}
.panels button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.panels button[aria-current="true"]{background:var(--mat);box-shadow:var(--shadow),inset 2px 0 0 var(--c)}
.panels .sum{font-family:var(--body);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav:not(:empty){margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.nav button{font-size:14.5px}
@media (max-width:860px){
  .panels{flex-direction:row;gap:5px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none}
  .panels::-webkit-scrollbar{display:none}
  .panels button{width:auto;flex:0 0 auto;grid-template-columns:auto auto;gap:7px;padding:6px 14px;font-size:16px;border-radius:999px;border:1px solid var(--line);background:var(--mat);box-shadow:none}
  .panels button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:none}
  .panels button[aria-current="true"] .sum{color:var(--paper);opacity:.7}
  .nav:not(:empty){margin-top:8px;padding-top:8px}
  .nav button{font-size:14px;padding:6px 11px}
  .side{min-width:0;padding:12px 16px 8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .panels,.nav{min-width:0;max-width:100%}
  .side-top{align-items:center}
  .side-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 0 auto}
  .side-foot .grand{font-size:20px}
}

/* Vendors */
.vhead{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.vstat{background:var(--mat);box-shadow:var(--shadow);padding:14px 18px;min-width:132px}
.vstat span{display:block;color:var(--muted);font-size:12px}
.vstat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.filters button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:5px 13px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.vcard{text-align:left;background:var(--mat);border:0;box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s ease}
.vcard:hover,.vcard:focus-visible{transform:translateY(-2px)}
.vshot{aspect-ratio:16/10;background:color-mix(in srgb,var(--ink) 6%,transparent);position:relative;overflow:hidden}
.vshot img{width:100%;height:100%;object-fit:cover}
.vshot .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.vbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.vcat{font-size:12px;color:var(--muted)}
.vcard h3{margin:0;font-weight:400;font-size:18px;line-height:1.25}
.vmeta{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word}
.vdays{display:flex;gap:4px;flex-wrap:wrap}
.vday{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 26%,var(--mat));white-space:nowrap}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.vfoot .price{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.vs{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.vs[data-s="Quoted"]{border-color:var(--ink);color:var(--ink)}
.vs[data-s="Booked"]{border-color:var(--gold);color:var(--gold)}
.vs[data-s="Paid"],.vs[data-s="Done"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Personnel */
.roster{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.rtile{background:var(--mat);box-shadow:var(--shadow);padding:11px 15px;min-width:148px;max-width:270px}
.rtile span{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.rtile b{font-weight:400;font-size:15px;line-height:1.4}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px}
.prow:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 24%,var(--mat));font-family:var(--display);font-size:16px}
.pmain{display:flex;flex-direction:column;gap:1px;min-width:0}
.pname{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pph{font-size:13px;color:var(--muted)}
.ptags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:58%}
.pduty{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--gold) 20%,var(--mat));white-space:nowrap}
@media (max-width:700px){.prow{grid-template-columns:34px minmax(0,1fr);row-gap:6px}.ptags{grid-column:2;justify-content:flex-start;max-width:none}}

/* Activities */
.addtag{display:flex;gap:8px;margin-top:10px}
.addtag .in{flex:1;min-width:0}
.customlist{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ctag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 11px;background:var(--mat);color:var(--ink);font-size:12px}
.ctag button{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
.ctag button:hover{color:#B4413C}
.ptasks{list-style:none;margin:0;padding:0;font-size:14px}
.ptasks li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ptasks li em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}
.ptasks li.done{color:var(--muted);text-decoration:line-through}
.ptodo{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,#C7899B 30%,var(--mat));white-space:nowrap}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;max-width:780px}
.addbar .in{flex:1 1 240px}
.tgroup{margin-bottom:32px;max-width:880px}
.tgroup h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.tgroup .cnt{color:var(--muted);font-size:13px;margin:2px 0 10px}
.trow{display:grid;grid-template-columns:26px 1fr 158px 120px 28px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.trow .in{background:transparent;border:1px solid transparent;border-radius:5px;padding:6px 8px}
.trow .in:hover{border-color:var(--line)}
.trow .in:focus{background:var(--mat);border-color:var(--accent);outline:none}
.tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;font-size:12px;color:transparent;padding:0;line-height:1}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trow.done [data-tf="title"]{text-decoration:line-through;color:var(--muted)}
.trow .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0}
.trow .x:hover{color:#B4413C}
.trow input[type=date].late{color:#B4413C}
@media (max-width:700px){
  .trow{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"tick title del" "dot due who";row-gap:4px;align-items:center}
  .trow .tick{grid-area:tick}
  .trow [data-tf="title"]{grid-area:title}
  .trow [data-tf="due"]{grid-area:due;justify-self:start;padding-left:0}
  .trow select{grid-area:who;justify-self:end}
  .trow .x{grid-area:del}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div>
        <p class="mark">Bako &amp; Made</p>
        <p class="mark-sub">Our wedding planner</p>
      </div>
      <div class="side-foot" id="sideFootMobile"></div>
    </div>
    <div class="panels" id="panels"></div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="drop" id="drop"><div>Drop to add looks</div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Edit look"></aside>
<input type="file" id="file" accept="image/*" multiple class="sr" tabindex="-1">
<div class="toast" id="toast" role="status"></div>

<script>
const CH=[
 {id:'court',name:'Court wedding',color:'#8FA3B3',note:'Simple, tailored looks for the registry.'},
 {id:'prewedding',name:'Pre-wedding shoot',color:'#9DAE8C',slots:3,note:'Three outfits for the photo shoot.'},
 {id:'introduction',name:'Introduction',color:'#C7899B',note:'Family-coordinated colors and attire.'},
 {id:'traditional',name:'Traditional marriage',color:'#7A2E3A',note:'Traditional attire, beads and accessories.'},
 {id:'church',name:'Church wedding',color:'#CDBFA8',note:'Gown, suit, veil and bridal party.'}
];
const FIELDS=[['outfit','Outfit & fabric'],['accessories','Accessories'],['shoes','Shoes'],['beauty','Hair & makeup'],['notes','Notes']];
const WHO=['Bride','Groom','Both','Family'];
const LOOKWHO=['Bride','Groom','Both',"Bride's mother","Bride's father","Groom's mother","Groom's father",'Parents','Bridal train','Family'];
const STATUS=['Idea','Chosen','Sourcing','Ready'];
const CURS={NGN:'Naira (₦)',EUR:'Euro (€)',USD:'Dollar ($)',GBP:'Pound (£)'};
const DEFAULT_COSTS=[{label:'Outfit',amount:''},{label:'Shoes',amount:''},{label:'Accessories',amount:''}];
const VCAT=['Event centre','Decoration','Photography','Videography','Makeup','Hair','Content creator','Cake','Food & drinks','Small chops','DJ / live band','MC','Souvenirs','Graphics & IV','Rentals','Security & ushers','Transport','Planner','Other'];
const VSTATUS=['Shortlisted','Contacted','Quoted','Booked','Paid','Done'];
const PROLE=['Bride','Groom','Maid of honor','Chief bridesmaid','Best man','Bridesmaid','Groomsman','Little bride','Parent','Family','Friend','Vendor liaison','Other'];
const PDUTY=['Rings','Transport','Guests & ushering','Gifts','Drinks','Food service','Photography','Music & MC','Security','Decoration','Money & payments','Errands'];
const allDuties=()=>[...new Set([...PDUTY,...S.custom.duties,...[...S.people.values()].flatMap(p=>p.duties||[])])];
const allRoles=()=>[...new Set([...PROLE,...S.custom.roles,...[...S.people.values()].map(p=>p.role).filter(Boolean)])];
const whoLabel=v=>{if(!v)return 'Both';if(v.slice(0,2)==='p:'){const p=S.people.get(v.slice(2));return p?(p.name||'Unnamed'):'Unassigned'}return v};
const tasksFor=pid=>[...S.tasks.entries()].map(([id,t])=>({id,...t})).filter(t=>t.who==='p:'+pid).sort((a,b)=>{const x=a.due||'9999-99-99',y=b.due||'9999-99-99';return x===y?0:(x<y?-1:1)});
const newPerson=(name='',role='Bridesmaid')=>({name,role,duties:[],days:[],phone:'',notes:'',order:Date.now()+Math.random(),createdAt:new Date().toISOString()});
const newVendor=()=>({name:'',cat:VCAT[0],days:[],status:'Shortlisted',phone:'',link:'',quote:'',paid:'',notes:'',images:[],order:Date.now()+Math.random(),createdAt:new Date().toISOString()});

const S={overview:{palette:[]},chapters:{},looks:new Map(),vendors:new Map(),tasks:new Map(),people:new Map(),custom:{duties:[],roles:[]},currency:'NGN',active:'home',lastLook:'overview',budget:0,noCosts:false,open:null,openKind:null,vfilter:'all',mode:'local',canWrite:true,canUpload:true};
S.chapters=Object.fromEntries(CH.map(c=>[c.id,{palette:[],date:''}]));
const metaObj=k=>k==='overview'?S.overview:S.chapters[k];
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'})};
let db=null,assets=null,col=null,settingsRef=null;
const localBlobs=new Map(),dirty=new Set(),deleted=new Set(),writing=new Set(),again=new Set(),timers=new Map();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const lookTotal=l=>(l.costs||[]).reduce((a,c)=>a+num(c.amount),0);
function money(n){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:S.currency,currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(n)}catch{return S.currency+' '+Math.round(n).toLocaleString('en-US')}}
const tagOf=(l,id)=>(l.imageTags||{})[id]||'';
const imgSrc=id=>S.mode==='db'?'/_blob/'+id:(localBlobs.get(id)||'');
const byChapter=ch=>[...S.looks.entries()].map(([id,l])=>({id,...l})).filter(l=>l.chapter===ch).sort((a,b)=>(a.order||0)-(b.order||0));
const chTotal=ch=>byChapter(ch).reduce((a,l)=>a+lookTotal(l),0);
const grandTotal=()=>[...S.looks.values()].reduce((a,l)=>a+lookTotal(l),0);
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- Render ---------- */
const PANELS=[{id:'home',name:'Home',color:'var(--ink)'},{id:'looks',name:'Looks',color:'var(--gold)'},{id:'people',name:'Personnel',color:'#8FA3B3'},{id:'vendors',name:'Vendors',color:'var(--accent)'},{id:'activities',name:'Activities',color:'#C7899B'},{id:'money',name:'Total costs',color:'#7A2E3A'}];
const panelOf=a=>['home','people','vendors','activities','money'].includes(a)?a:'looks';
const SCOPE={home:'all',looks:'looks',people:'people',vendors:'vendors',activities:'tasks',money:'money'};
const vTotals=()=>{const a=vAll();return{quoted:a.reduce((x,v)=>x+vQuote(v),0),paid:a.reduce((x,v)=>x+vPaid(v),0)}};
const committed=()=>grandTotal()+vTotals().quoted;
const nextDate=()=>CH.map(c=>S.chapters[c.id]&&S.chapters[c.id].date).filter(Boolean).sort()[0]||'';
const openTasks=()=>[...S.tasks.values()].filter(t=>t.status!=='Done').length;
const curHTML=()=>`<label class="cur">Currency <select id="curSel" ${S.canWrite?'':'disabled'}>${Object.entries(CURS).map(([k,v])=>`<option value="${k}" ${k===S.currency?'selected':''}>${v}</option>`).join('')}</select></label>`;
function footHTML(panel,mobile){
  let label,value,btns='';
  if(panel==='vendors'){
    const all=vAll();
    label='Still owing vendors';value=money(Math.max(0,all.reduce((a,v)=>a+vQuote(v),0)-all.reduce((a,v)=>a+vPaid(v),0)));
  }else if(panel==='activities'){label='Still to do';value=String(openTasks());}
  else if(panel==='people'){label='People on the team';value=String(S.people.size);}
  else if(panel==='money'){label='Committed so far';value=money(committed());}
  else if(panel==='home'){label='Committed so far';value=money(committed());}
  else{label='Total for all looks';value=money(grandTotal());}
  const sc=SCOPE[panel]||'all';
  btns=`<button class="btn small" data-pdf="${sc}">PDF</button><button class="btn small" data-csv="${sc}">CSV</button>`;
  if(mobile)return `<div class="grand">${value}</div>${btns}`;
  const tog=panel==='money'?'':`<label class="nocost"><input type="checkbox" id="noCost" ${S.noCosts?'checked':''}>Leave costs out</label>`;
  return `<div class="grand-label">${label}</div><div class="grand">${value}</div><div class="foot-btns">${btns}</div>${tog}${panel==='looks'||panel==='vendors'||panel==='money'?curHTML():''}`;
}
function renderSide(){
  const panel=panelOf(S.active);
  const counts={looks:S.looks.size||'',people:S.people.size||'',vendors:S.vendors.size||'',activities:openTasks()||''};
  $('#panels').innerHTML=PANELS.map(p=>`<button data-panel="${p.id}" style="--c:${p.color}" aria-current="${panel===p.id}">${p.name}<span class="sum">${counts[p.id]||''}</span></button>`).join('');
  const items=CH.map(c=>`<li><button data-nav="${c.id}" style="--c:${c.color}" aria-current="${S.active===c.id}"><span class="dot"></span><span>${c.name}</span><span class="sum">${byChapter(c.id).length||''}</span></button></li>`).join('');
  $('#nav').innerHTML=panel!=='looks'?'':`<li><button data-nav="overview" style="--c:var(--gold)" aria-current="${S.active==='overview'}"><span class="dot"></span><span>Overview</span><span class="sum"></span></button></li>`+items+`<li><button data-nav="summary" style="--c:var(--ink)" aria-current="${S.active==='summary'}"><span class="dot"></span><span>Cost summary</span><span class="sum"></span></button></li>`;
  const mobile=matchMedia('(max-width:860px)').matches;
  $('#sideFoot').innerHTML=mobile?'':footHTML(panel,false);
  $('#sideFootMobile').innerHTML=mobile?footHTML(panel,true):'';
}

function cardHTML(l,i){
  const c=CH.find(x=>x.id===l.chapter)||CH[0];
  const h=hash(l.id);const tilt=((h%7)-3)*0.35;const tape=((h>>3)%9)-4;
  const imgs=l.images||[];
  const lines=FIELDS.filter(([k])=>l[k]).slice(0,3).map(([k,lab])=>`<li><span>${lab}.</span> ${esc(l[k])}</li>`).join('');
  const sw=(l.colors||[]).map(s=>`<i class="sw" style="--s:${esc(s)}"></i>`).join('');
  const total=lookTotal(l);
  return `<button class="look" data-open="${l.id}" style="--tilt:${tilt}deg;--tape:${tape}deg;--c:${c.color};--ar:${i%3===1?'3/4':'4/5'}">
    <div class="mat"><span class="tape"></span>
      <div class="photo">${imgs[0]?`<img src="${imgSrc(imgs[0])}" alt="${esc(l.title||'Outfit idea')}" loading="lazy">`:`<div class="ph">No picture yet.<br>Open to add one.</div>`}
      ${imgs[0]&&tagOf(l,imgs[0])?`<span class="tagtxt">${esc(tagOf(l,imgs[0]))}</span>`:''}
      ${imgs.length>5?`<span class="more">+${imgs.length-5}</span>`:''}</div>
      ${imgs.length>1?`<div class="strip">${imgs.slice(1,5).map(im=>`<figure><img src="${imgSrc(im)}" alt="" loading="lazy">${tagOf(l,im)?`<figcaption>${esc(tagOf(l,im))}</figcaption>`:''}</figure>`).join('')}</div>`:''}
      <div class="cap">
        <div class="cap-top"><h3>${esc(l.title||'Untitled look')}</h3><span class="who">${esc(l.who||'')}</span></div>
        ${sw?`<div class="swatches">${sw}</div>`:''}
        ${lines?`<ul class="lines">${lines}</ul>`:''}
        <div class="cap-foot"><span class="price">${total?money(total):'<span style="color:var(--muted);font-size:15px;font-family:var(--body)">No cost yet</span>'}</span><span class="status" data-s="${esc(l.status||'Idea')}">${esc(l.status||'Idea')}</span></div>
      </div>
    </div></button>`;
}

function paletteHTML(k){
  const pal=metaObj(k).palette||[];
  return `<div class="pal">${pal.map((p,i)=>`<div class="pchip"><span class="psw" style="--s:${esc(p.hex)}"></span>${p.name?`<span class="pname">${esc(p.name)}</span>`:''}<span class="phex">${esc(p.hex)}</span>${S.canWrite?`<button class="prm" data-pal-rm="${k}|${i}" aria-label="Remove color">×</button>`:''}</div>`).join('')}
  ${!pal.length&&!S.canWrite?'<span class="muted">No colors yet</span>':''}
  ${S.canWrite?`<div class="padd"><input type="color" id="pc-${k}" value="#7a2e3a" aria-label="Pick a color"><input class="in" id="pn-${k}" placeholder="Name, e.g. Wine" maxlength="24"><button class="btn small" data-pal-add="${k}">Add color</button></div>`:''}</div>`;
}
function overviewHTML(){
  const dis=S.canWrite?'':'disabled';
  return `<header class="head"><div><h1>Overview</h1><div class="meta">${S.looks.size} ${S.looks.size===1?'look':'looks'} across ${CH.length} ceremonies</div></div><div class="actions"><button class="btn primary" data-pdf="looks">Export PDF</button><button class="btn" data-csv="looks">Export CSV</button></div></header>
  <section class="ov"><h2 class="sub-h first">Our palette</h2>${paletteHTML('overview')}</section>
  <section class="ov"><h2 class="sub-h">Dates</h2><div>${CH.map(c=>{const m=S.chapters[c.id];return `<div class="date-row" style="--c:${c.color}"><span class="dot"></span><button class="link" data-nav="${c.id}">${c.name}</button><input type="date" class="in date-in" data-date="${c.id}" value="${esc(m.date||'')}" aria-label="${c.name} date" ${dis}><span class="mini-pal">${(m.palette||[]).map(p=>`<i class="sw" style="--s:${esc(p.hex)}"></i>`).join('')}</span><span class="amt">${money(chTotal(c.id))}</span></div>`}).join('')}</div></section>`;
}
function homeHTML(){
  const v=vTotals(),open=openTasks(),today=new Date().toISOString().slice(0,10);
  const late=[...S.tasks.values()].filter(t=>t.status!=='Done'&&t.due&&t.due<today).length;
  const booked=vAll().filter(x=>['Booked','Paid','Done'].includes(x.status)).length;
  const duties=allDuties().filter(d=>[...S.people.values()].some(p=>(p.duties||[]).includes(d))).length;
  const d=nextDate();
  let when='<span class="when">No dates set yet. Add them under Looks.</span>';
  if(d){
    const days=Math.ceil((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
    const c=CH.find(x=>(S.chapters[x.id]||{}).date===d);
    when=`<div class="when">${c?esc(c.name):'First ceremony'} on ${esc(fmtDate(d))}<br><b>${days>0?days+' days to go':days===0?'Today':'Done'}</b></div>`;
  }
  const tiles=[
    {p:'looks',c:'var(--gold)',h:'Looks',n:String(S.looks.size),s:`${money(grandTotal())} across ${CH.length} ceremonies`},

function moneyHTML(){
  const v=vTotals(),looks=grandTotal(),com=committed(),b=S.budget;
  const row=(label,amt,sub,cls)=>`<div class="mrow ${cls||''}"><span>${label}${sub?`<small>${sub}</small>`:''}</span><span class="amt">${amt}</span></div>`;
  const base=Math.max(b||0,com,1);
  const bar=`<div class="mbar"><i style="width:${v.paid/base*100}%;background:var(--accent)"></i><i style="width:${Math.max(0,com-v.paid)/base*100}%;background:var(--gold)"></i></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Paid ${money(v.paid)}</span><span><i style="background:var(--gold)"></i>Committed, not yet paid ${money(Math.max(0,com-v.paid))}</span>${b?`<span><i style="background:color-mix(in srgb,var(--ink) 10%,transparent)"></i>Unspent ${money(Math.max(0,b-com))}</span>`:''}</div>`;
  const over=b&&com>b;
  return `<header class="head"><div><h1>Total costs</h1><div class="meta">Outfits and vendors together</div><p class="note" style="--c:#7A2E3A">Everything the wedding is committed to, in one place.</p></div><div class="actions"><button class="btn primary" data-pdf="money">Export PDF</button><button class="btn" data-csv="all">Export CSV</button></div></header>
  <div class="mrow"><span>Your budget<small>Type the ceiling you both agreed on</small></span><span><input class="in budget-in" id="budgetIn" inputmode="decimal" value="${b||''}" placeholder="e.g. 7000000" ${S.canWrite?'':'disabled'}></span></div>
  ${row('Outfits and looks',money(looks),`${S.looks.size} ${S.looks.size===1?'look':'looks'}`)}
  ${row('Vendors quoted',money(v.quoted),`${S.vendors.size} ${S.vendors.size===1?'vendor':'vendors'}`)}
  ${row('<b style="font-weight:400">Committed altogether</b>',money(com),'',over?'total over':'total')}
  ${bar}
  <h2 class="sub-h">Against the budget</h2>
  ${b?row('Budget',money(b))+row('Committed',money(com))+row(com>b?'<span class="over">Over budget by</span>':'Left to spend',money(Math.abs(b-com)),'','total'):'<p class="muted">Set a budget above and this fills in.</p>'}
  <h2 class="sub-h">What is already paid</h2>
  ${row('Paid to vendors',money(v.paid))}
  ${row('Still owing vendors',money(Math.max(0,v.quoted-v.paid)),'','total')}
  <h2 class="sub-h">Looks by ceremony</h2>
  ${CH.map(c=>row(esc(c.name),money(chTotal(c.id)),fmtDate((S.chapters[c.id]||{}).date)||'')).join('')}

}
function renderMain(){
  const m=$('#main');
  const banner=S.mode==='browser'?`<div class="banner">Saved in this browser only.</div>`:S.mode==='local'?`<div class="banner">Preview only. Changes are not saved.</div>`:'';
  if(S.active==='home'){m.innerHTML=banner+homeHTML();return}
  if(S.active==='money'){m.innerHTML=banner+moneyHTML();return}
  if(S.active==='summary'){m.innerHTML=banner+summaryHTML();return}
  if(S.active==='overview'){m.innerHTML=banner+overviewHTML();return}
  if(S.active==='people'){m.innerHTML=banner+peopleHTML();return}
  if(S.active==='vendors'){m.innerHTML=banner+vendorsHTML();return}
  if(S.active==='activities'){m.innerHTML=banner+tasksHTML();return}
  const c=CH.find(x=>x.id===S.active);
  const looks=byChapter(c.id);const tot=chTotal(c.id);
  let board;
  if(!looks.length&&!c.slots){
    board=`<div class="empty"><p>Drop or paste pictures here.</p>${S.canWrite?`<button class="btn primary" data-add-pics>Add pictures</button>`:''}</div>`;
  }else{
    const slots=c.slots?Math.max(0,c.slots-looks.length):0;
    const words=['one','two','three'];
    board=`<div class="board">${looks.map(cardHTML).join('')}${S.canWrite?Array.from({length:slots},(_,k)=>`<button class="slot" data-add-pics><span><strong>Look ${words[looks.length+k]||looks.length+k+1}</strong>Add a picture</span></button>`).join(''):''}</div>`;
  }
  m.innerHTML=`${banner}<header class="head" style="--c:${c.color}">
    <div><h1>${c.name}</h1><div class="meta">${looks.length} ${looks.length===1?'look':'looks'}${tot?', '+money(tot):''}</div><p class="note">${c.note}</p></div>
    ${S.canWrite?`<div class="actions"><button class="btn primary" data-add-pics>Add pictures</button><button class="btn" data-add-blank>Blank look</button></div>`:''}
  </header>
  <section class="chmeta"><div><h2 class="mini">Date</h2><input type="date" class="in date-in" data-date="${c.id}" value="${esc(S.chapters[c.id].date||'')}" aria-label="Date" ${S.canWrite?'':'disabled'}></div><div><h2 class="mini">Palette for this day</h2>${paletteHTML(c.id)}</div></section>
  ${board}`;
}

}

function tasksHTML(){
  const all=[...S.tasks.entries()].map(([id,t])=>({id,...t}));
  const today=new Date().toISOString().slice(0,10);
  const open=all.filter(t=>t.status!=='Done').sort((a,b)=>{const x=a.due||'9999-99-99',y=b.due||'9999-99-99';return x===y?(a.order||0)-(b.order||0):(x<y?-1:1)});
  const done=all.filter(t=>t.status==='Done').sort((a,b)=>(b.order||0)-(a.order||0));
  const groups=[['Overdue',open.filter(t=>t.due&&t.due<today)],['Today',open.filter(t=>t.due===today)],['Coming up',open.filter(t=>t.due&&t.due>today)],['No date yet',open.filter(t=>!t.due)],['Done',done]].filter(g=>g[1].length);
  const bar=S.canWrite?`<div class="addbar"><input class="in" id="taskIn" placeholder="What needs doing" maxlength="160"><input class="in" id="taskDue" type="date" aria-label="Due date" style="max-width:170px"><button class="btn primary" data-taddnew>Add</button></div>`:'';

}

/* ---------- Data writes ---------- */
function clean(l){const o={...l};delete o.id;return JSON.parse(JSON.stringify(o))}
function change(id,fn,{redrawDrawer=false}={}){
  const l=S.looks.get(id);if(!l||!S.canWrite)return;
  fn(l);dirty.add(id);render();if(redrawDrawer)refreshDrawer();else{const t=$('#lookTotal');if(t)t.textContent=money(lookTotal(l))}
  schedule(id);
}
function schedule(id,delay=600){if(S.mode==='local'){dirty.delete(id);return}clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>flush(id),delay))}
async function flush(id){
  if(writing.has(id)){again.add(id);return}
  writing.add(id);
  try{
    if(S.mode==='browser'){
      if(deleted.has(id))await tx('looks','readwrite',st=>st.delete(id));
      else{const l=S.looks.get(id);if(l)await tx('looks','readwrite',st=>st.put({...clean(l),id}))}
    }else if(deleted.has(id))await col.doc(id).delete();
    else{const l=S.looks.get(id);if(l)await col.doc(id).set(clean(l))}
  }catch(e){handleErr(e)}
  finally{writing.delete(id);if(again.has(id)){again.delete(id);flush(id)}else{dirty.delete(id);deleted.delete(id)}}
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'){S.canWrite=false;render();refreshDrawer();toast('This page is view-only for you.')}
  else if(c==='quota_exceeded'||c==='quota_or_state')toast('Storage is full. Remove some looks or pictures.');
  else if(c==='too_large')toast('That picture is too large.');
  else if(c==='unsupported_type')toast('Use JPG, PNG or WebP pictures.');
  else if(c==='rate_limited'||c==='resource_exhausted')toast('Slow down a moment, then try again.');
  else toast('Could not save. Check your connection.');
}
function newLook(chapter,images=[]){
  const id=S.mode==='db'?col.doc().id:'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  S.looks.set(id,l);dirty.add(id);schedule(id,0);return id;
}

const metaDirty=new Set(),metaWriting=new Set(),metaAgain=new Set(),metaTimers=new Map();
function changeMeta(k,fn){if(!S.canWrite)return;fn(metaObj(k));metaDirty.add(k);render();if(S.mode==='local'){metaDirty.delete(k);return}clearTimeout(metaTimers.get(k));metaTimers.set(k,setTimeout(()=>flushMeta(k),300))}
async function flushMeta(k){

/* ---------- Vendors and tasks, shared record writes ---------- */
const KIND={vendor:{map:()=>S.vendors,store:'vendors'},task:{map:()=>S.tasks,store:'tasks'},person:{map:()=>S.people,store:'people'}};
const rdirty=new Set(),rdel=new Set(),rwrite=new Set(),ragain=new Set(),rtimers=new Map();
const rkey=(k,id)=>k+':'+id;
let pendingVendor=null;
function rchange(kind,id,fn,{redraw=true,now=false}={}){
  const r=KIND[kind].map().get(id);if(!r||!S.canWrite)return;
  fn(r);rdirty.add(rkey(kind,id));if(redraw)render();
  rsched(kind,id,now?0:600);
}
function flushPending(){
  for(const key of [...rdirty]){const i=key.indexOf(':');clearTimeout(rtimers.get(key));rflush(key.slice(0,i),key.slice(i+1))}
  for(const id of [...dirty]){clearTimeout(timers.get(id));flush(id)}
  for(const k of [...metaDirty]){clearTimeout(metaTimers.get(k));flushMeta(k)}
}
addEventListener('pagehide',flushPending);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPending()});
function rsched(kind,id,delay=600){const key=rkey(kind,id);if(S.mode==='local'){rdirty.delete(key);return}clearTimeout(rtimers.get(key));rtimers.set(key,setTimeout(()=>rflush(kind,id),delay))}
async function rflush(kind,id){
  const key=rkey(kind,id);
  if(rwrite.has(key)){ragain.add(key);return}
  rwrite.add(key);
  try{
    const r=KIND[kind].map().get(id);const store=KIND[kind].store;
    if(S.mode==='browser'){
      if(rdel.has(key))await tx(store,'readwrite',st=>st.delete(id));
      else if(r)await tx(store,'readwrite',st=>st.put({...JSON.parse(JSON.stringify(r)),id}));
    }else if(rdel.has(key))await db.collection(store).doc(id).delete();
    else if(r)await db.collection(store).doc(id).set(JSON.parse(JSON.stringify(r)));
  }catch(e){handleErr(e)}
  finally{rwrite.delete(key);if(ragain.has(key)){ragain.delete(key);rflush(kind,id)}else{rdirty.delete(key);rdel.delete(key)}}
}
function rnew(kind,data){
  const id=S.mode==='db'?db.collection(KIND[kind].store).doc().id:kind[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  KIND[kind].map().set(id,data);rdirty.add(rkey(kind,id));rsched(kind,id,0);return id;
}
function rdelete(kind,id){KIND[kind].map().delete(id);const key=rkey(kind,id);rdel.add(key);rdirty.add(key);render();rsched(kind,id,0)}
function mergeSnap(kind,snap,target){
  const next=new Map();const pre=kind+':';
  for(const d of snap.docs){const key=pre+d.id;if(rdel.has(key))continue;next.set(d.id,rdirty.has(key)&&target.has(d.id)?target.get(d.id):{...d.data()})}
  for(const key of rdirty){if(!key.startsWith(pre))continue;const id=key.slice(pre.length);if(!next.has(id)&&target.has(id)&&!rdel.has(key))next.set(id,target.get(id))}
  return next;
}
async function addVendorImages(files,id){

/* ---------- Images ---------- */
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.86));
  }catch{return file}
}
async function storeImage(file){
  const b=await shrink(file);
  if(S.mode==='db'){const r=await assets.upload(b,{type:b.type||'image/jpeg'});return r.id}
  const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  if(S.mode==='browser')await tx('images','readwrite',st=>st.put({id,blob:b}));
  localBlobs.set(id,URL.createObjectURL(b));return id;
}
let pendingTarget=null;
async function addImages(files,{lookId=null,chapter=S.active}={}){
  files=[...files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));
  if(!files.length)return;
  if(!S.canWrite||!S.canUpload){toast('You can view these looks but not add pictures.');return}
  if(chapter==='summary'||chapter==='overview'){if(!lookId){toast('Open a ceremony page first.');return}chapter='court'}
  toast(files.length>1?`Adding ${files.length} pictures`:'Adding picture');
  let made=null;
  for(const f of files){
    try{
      const imgId=await storeImage(f);
      if(lookId)change(lookId,l=>{l.images=[...(l.images||[]),imgId]},{redrawDrawer:true});
      else{made=newLook(chapter,[imgId]);render()}
    }catch(e){handleErr(e)}
  }
  if(made&&files.length===1)openDrawer(made);
}

          room(ls.length*4.6+4,acc);
          T(ls,M,y,{size:10.5});
          T([whoLabel(t.who),t.due?fmtDate(t.due):''].filter(Boolean).join('  ·  '),PW-M,y,{size:9,color:mut,align:'right'});
          y+=Math.max(5,ls.length*4.6)+1;rule();y+=4.5;
        });
        y+=5;
      });
    }
    // Total costs
    if(!nc&&(scope==='all'||scope==='money')){
      const vt=vTotals(),looks=grandTotal(),com=committed();
      const acc=sectionPage('Total costs','Outfits and vendors together','#7A2E3A');
      moneyRow('Outfits and looks',pm(looks),acc);
      moneyRow('Vendors quoted',pm(vt.quoted),acc);
      moneyRow('Committed altogether',pm(com),acc,true);
      y+=6;
      if(S.budget){
        T('Against the budget',M,y,{font:'times',size:17});y+=9;
        moneyRow('Budget',pm(S.budget),acc);
        moneyRow(com>S.budget?'Over budget by':'Left to spend',pm(Math.abs(S.budget-com)),acc,true);
        y+=6;
      }
      T('Already paid',M,y,{font:'times',size:17});y+=9;
      moneyRow('Paid to vendors',pm(vt.paid),acc);
      moneyRow('Still owing vendors',pm(Math.max(0,vt.quoted-vt.paid)),acc,true);
      y+=6;
      T('Looks by ceremony',M,y,{font:'times',size:17});y+=9;
      CH.forEach(c=>moneyRow(c.name,pm(chTotal(c.id)),acc));
      moneyRow('All looks',pm(looks),acc,true);
    }
    const blob=doc.output('blob');const name=(SCOPENAME[scope]||'wedding-planner')+(nc?'-no-costs':'')+'.pdf';
    const dl=S.mode==='db'&&window.claude?await claude.use('downloads').catch(()=>null):null;
    if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(e.code!=='declined')toast('Could not save the PDF here.')}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){toast('PDF export failed. Check your connection.')}
  finally{btn.disabled=false;btn.textContent=old}
}

/* ---------- Init ---------- */
render();
(async()=>{
  if(window.claude&&claude.use){try{db=await claude.use('db')}catch{db=null}}
  if(!db){await initBrowser();return}
  S.mode='db';
  const [user,as]=await Promise.all([claude.use('user').catch(()=>null),claude.use('assets').catch(()=>null)]);
  assets=as;S.canUpload=!!assets;
  if(user){const w=await user.can('data.write').catch(()=>null);if(w===false)S.canWrite=false}
  col=db.collection('looks');settingsRef=db.doc('meta/settings');
  render();
  col.onSnapshot(snap=>{
    const next=new Map();
    for(const d of snap.docs){if(deleted.has(d.id))continue;next.set(d.id,dirty.has(d.id)&&S.looks.has(d.id)?S.looks.get(d.id):{...d.data()})}
    for(const id of dirty)if(!next.has(id)&&S.looks.has(id)&&!deleted.has(id))next.set(id,S.looks.get(id));
    S.looks=next;render();
    if(S.open&&!dirty.has(S.open)&&!$('#drawer').contains(document.activeElement))refreshDrawer();
    else if(S.open&&!S.looks.has(S.open))closeDrawer();
  },e=>{if(e.code==='revoked'){S.canWrite=false;render()}});
  db.doc('meta/overview').onSnapshot(sn=>{if(metaDirty.has('overview'))return;S.overview={palette:[],...(sn.exists?sn.data():{})};render()});
  db.collection('chapters').onSnapshot(sn=>{for(const d of sn.docs){if(!S.chapters[d.id]||metaDirty.has(d.id))continue;S.chapters[d.id]={palette:[],date:'',...d.data()}}render()});
  settingsRef.onSnapshot(s=>{if(!s.exists)return;readSettings(s.data());render();if(!$('#drawer').contains(document.activeElement))refreshDrawer()});
  db.collection('vendors').onSnapshot(sn=>{
    S.vendors=mergeSnap('vendor',sn,S.vendors);render();
    if(S.openKind==='vendor'&&S.open){
      if(!S.vendors.has(S.open))closeDrawer();
      else if(!rdirty.has(rkey('vendor',S.open))&&!$('#drawer').contains(document.activeElement))refreshDrawer();
    }
  },e=>{if(e.code==='revoked'){S.canWrite=false;render()}});
  db.collection('people').onSnapshot(sn=>{
    S.people=mergeSnap('person',sn,S.people);render();
    if(S.openKind==='person'&&S.open){
      if(!S.people.has(S.open))closeDrawer();
      else if(!rdirty.has(rkey('person',S.open))&&!$('#drawer').contains(document.activeElement))refreshDrawer();
    }
  },e=>{if(e.code==='revoked'){S.canWrite=false;render()}});
  db.collection('tasks').onSnapshot(sn=>{
    S.tasks=mergeSnap('task',sn,S.tasks);
    if(!document.activeElement||!document.activeElement.closest('[data-tid]'))render();
  },e=>{if(e.code==='revoked'){S.canWrite=false;render()}});
})();
</script>
