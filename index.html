<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bako & Made">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFEEDD">
<title>Bako &amp; Made, Wedding Looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EFF0; --mat:#FFFFFF; --ink:#221C22; --muted:#7A7178; --line:#DDD6DA;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --gold:#A8854F; --tape:rgba(214,196,160,.62);
  --shadow:0 1px 2px rgba(34,28,34,.06),0 8px 24px -12px rgba(34,28,34,.18);
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:300 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:32px 22px 22px;border-right:1px solid var(--line)}
.mark{font-family:var(--display);font-size:38px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.mark-sub{color:var(--muted);font-size:13px;margin:0 0 30px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 10px;border-radius:6px;font-size:15px}
.nav button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.nav button[aria-current="true"]{background:var(--mat);box-shadow:var(--shadow);font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.nav .sum{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav .sep{height:1px;background:var(--line);margin:12px 6px}
.side-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.grand-label{color:var(--muted);font-size:13px}
.grand{font-family:var(--display);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;word-break:break-word}
.cur{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.cur select{background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 6px}

/* Main */
.col{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.col main{flex:1}
.credit{padding:24px clamp(18px,4vw,56px) 28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;letter-spacing:.02em}
main{padding:44px clamp(18px,4vw,56px) 80px;min-width:0;position:relative}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,84px);line-height:.95;margin:0;letter-spacing:-.005em}
.head .meta{color:var(--muted);font-size:14px;margin-top:10px}
.note{max-width:62ch;margin:18px 0 0;padding-left:14px;border-left:2px solid var(--c);color:var(--muted);font-size:15px}
.note b{font-weight:500;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:400}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:#B4413C}
.btn:disabled{opacity:.45;cursor:default}

/* Board (collage) */
.board{columns:3 250px;column-gap:28px}
.look{break-inside:avoid;margin:0 0 34px;display:block;width:100%;text-align:left;background:none;border:0;padding:0;transform:rotate(var(--tilt,0deg));transition:transform .25s ease}
.look:hover,.look:focus-visible{transform:rotate(0deg)}
.mat{position:relative;background:var(--mat);padding:12px 12px 14px;box-shadow:var(--shadow)}
.tape{position:absolute;top:-9px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(var(--tape,-3deg));background:var(--tape);backdrop-filter:blur(1px);z-index:2}
.photo{aspect-ratio:var(--ar,4/5);background:color-mix(in srgb,var(--c) 18%,var(--paper));overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.strip{display:flex;gap:6px;margin-top:8px}
.strip figure{margin:0;position:relative;width:52px}
.strip img{width:52px;height:52px;object-fit:cover}
.strip figcaption{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagsel{position:absolute;top:4px;left:4px;right:4px;width:calc(100% - 8px);font-size:11px;padding:1px 2px;border-radius:3px;border:0;background:var(--mat);}
.tagtxt{position:absolute;top:4px;right:4px;font-size:11px;background:var(--mat);padding:1px 6px;border-radius:3px}
.cap{padding:12px 2px 0}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cap h3{margin:0;font-weight:400;font-size:17px;line-height:1.3}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.swatches{display:flex;gap:5px;margin:8px 0 2px;flex-wrap:wrap}
.sw{width:16px;height:16px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lines{margin:8px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.5}
.lines li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lines span{color:var(--muted)}
.cap-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.status{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status[data-s="Chosen"]{border-color:var(--gold);color:var(--gold)}
.status[data-s="Sourcing"]{border-color:var(--ink);color:var(--ink)}
.status[data-s="Ready"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.slot{break-inside:avoid;margin:0 0 34px;width:100%;border:1.5px dashed var(--line);background:transparent;aspect-ratio:4/5;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.slot strong{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}
.slot:hover{border-color:var(--ink)}

.empty{border:1.5px dashed var(--line);padding:56px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px}

.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 82%,transparent);display:none;place-items:center;z-index:40;pointer-events:none}
.drop.on{display:grid}
.drop div{font-family:var(--display);font-size:40px;border:2px dashed var(--ink);padding:40px 60px;background:var(--mat)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,15,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:60;transform:translateX(100%);transition:transform .28s ease,visibility .28s;visibility:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none;visibility:visible}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.dr-head span{color:var(--muted);font-size:13px}
.dr-body{overflow-y:auto;padding:20px 22px 40px;flex:1}
.field{margin-bottom:18px}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in,textarea.in,select.in{width:100%;background:var(--mat);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-weight:300}
textarea.in{min-height:64px;resize:vertical;line-height:1.45}
.title-in{font-family:var(--display);font-size:30px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;background:var(--mat);overflow:hidden}
.imgs figure img{width:100%;height:100%;object-fit:cover}
.imgs figure .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.imgs figure .ctl button{background:none;border:0;color:#fff;font-size:12px;padding:2px 4px}
.imgs figure.cover{outline:2px solid var(--accent);outline-offset:2px}
.imgs .add{border:1.5px dashed var(--line);background:transparent;aspect-ratio:1;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:3px 6px 3px 4px;font-size:12px}
.chip .sw{width:18px;height:18px}
.chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:14px;line-height:1}
.picker{display:flex;align-items:center;gap:6px}
.picker input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;overflow:hidden}
.costs{display:flex;flex-direction:column;gap:8px}
.cost{display:grid;grid-template-columns:1fr 130px 28px;gap:8px;align-items:center}
.cost .x{border:0;background:none;color:var(--muted);font-size:18px}
.cost-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.cost-total b{font-family:var(--display);font-weight:400;font-size:26px}
.dr-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

/* Summary */
.big{font-family:var(--display);font-size:clamp(52px,9vw,110px);line-height:1;margin:6px 0 30px;font-variant-numeric:tabular-nums;word-break:break-word}
.bars{display:flex;flex-direction:column;gap:18px;max-width:760px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:16px;align-items:center;font-size:15px}
.bar{height:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.bar-row .amt{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.sub-h{font-family:var(--display);font-weight:400;font-size:30px;margin:52px 0 16px}
.splits{display:flex;flex-wrap:wrap;gap:14px}
.split{background:var(--mat);box-shadow:var(--shadow);padding:16px 20px;min-width:150px}
.split span{display:block;color:var(--muted);font-size:13px}
.split b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;max-width:900px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:400;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td button{background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.banner{background:var(--mat);border:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:24px;max-width:760px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mobile top bar + menu */
.mbar{display:none;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.hamb{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--mat);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.hamb span{display:block;width:18px;height:1.6px;background:var(--ink);border-radius:2px}
.hamb-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#3BA55C;border:2px solid var(--paper)}
.mb-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;font-size:16px;font-weight:400;text-align:left}
.mb-title span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-title .dot{flex:0 0 10px}
.mb-total{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.navscrim{position:fixed;inset:0;z-index:74;background:rgba(20,15,20,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:22px;border-top:1px solid var(--line)}
.pg{background:none;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left;font-size:16px;min-width:0;max-width:48%}
.pg.next{text-align:right;margin-left:auto}
.pg span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.pg:hover{border-color:var(--ink)}
.dr-cancel{display:inline-flex;align-items:center;gap:6px}
/* ---- Planner (Home, Personnel, Vendors, Activities, Total costs) ---- */

/* Home */
.hero{margin-bottom:38px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,92px);line-height:.95;margin:0}
.hero p{color:var(--muted);margin:10px 0 0;font-size:16px}
.hero .when{margin-top:18px;font-size:15px;color:var(--muted)}
.hero .when b{font-weight:400;font-family:var(--display);font-size:22px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px;margin-bottom:38px}
.tile{text-align:left;background:var(--mat);border:0;box-shadow:var(--shadow);padding:18px 20px 20px;display:flex;flex-direction:column;gap:5px;border-top:3px solid var(--c);transition:transform .2s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-2px)}
.tile h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.tile .big-n{font-family:var(--display);font-size:33px;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-word}
.tile .sub{color:var(--muted);font-size:13px;line-height:1.5}
.exports{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:22px;border-top:1px solid var(--line)}
.exports .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.nocost{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:10px;cursor:pointer}
.nocost input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* Total costs */
.mrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);max-width:760px}
.mrow .amt{font-variant-numeric:tabular-nums;font-size:17px}
.mrow.total{border-bottom:0;border-top:2px solid var(--ink)}
.mrow.total .amt{font-family:var(--display);font-size:26px}
.mrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mnybar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:760px;margin:22px 0 10px}
.mnybar i{display:block;height:100%}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr;gap:12px}.tile{padding:14px 15px 16px}.tile .big-n{font-size:27px}}
@media (max-width:430px){.tiles{grid-template-columns:1fr}}

/* Vendors */
.vhead{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.vstat{background:var(--mat);box-shadow:var(--shadow);padding:14px 18px;min-width:132px}
.vstat span{display:block;color:var(--muted);font-size:12px}
.vstat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.vfilters button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:5px 13px;font-size:13px}
.vfilters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.vcard{text-align:left;background:var(--mat);border:0;box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s ease}
.vcard:hover,.vcard:focus-visible{transform:translateY(-2px)}
.vshot{aspect-ratio:16/10;background:color-mix(in srgb,var(--ink) 6%,transparent);position:relative;overflow:hidden}
.vshot img{width:100%;height:100%;object-fit:cover}
.vshot .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.vbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.vcat{font-size:12px;color:var(--muted)}
.vcard h3{margin:0;font-weight:400;font-size:18px;line-height:1.25}
.vmeta{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word}
.vdays{display:flex;gap:4px;flex-wrap:wrap}
.vday{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 26%,var(--mat));white-space:nowrap}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.vfoot .price{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.vs{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.vs[data-s="Quoted"]{border-color:var(--ink);color:var(--ink)}
.vs[data-s="Booked"]{border-color:var(--gold);color:var(--gold)}

button.act:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.act.heart.on{color:#B4413C;--hf:#B4413C}
.act.due{color:var(--ink);background:color-mix(in srgb,var(--gold) 18%,transparent);font-size:12px}
.act.due.late{background:color-mix(in srgb,#B4413C 15%,transparent);color:#B4413C}
.owed{display:block;font-family:var(--body);font-size:11px;color:var(--muted);margin-top:1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.filters .in{width:auto;padding:8px 10px;font-size:14px}
.filters input{flex:1 1 200px}
.flt-note{font-size:13px;color:var(--muted);margin:-8px 0 16px}
.linkbtn{background:none;border:0;padding:0 4px;text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:13px}
.chmeta-left{display:flex;flex-direction:column;gap:18px}
.budbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-top:8px;overflow:hidden;max-width:200px}
.budbar i{display:block;height:100%;background:var(--accent)}
.budbar.over i{background:#B4413C}
.budtxt{font-size:12px;color:var(--muted);margin-top:4px}
.budtxt.over{color:#B4413C}
.cd{font-weight:400;color:var(--ink)}
.date-row small.cd{display:block;font-size:11px;color:var(--muted)}
.countdown{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding:10px 16px;border-left:3px solid var(--c);background:var(--mat);box-shadow:var(--shadow);width:fit-content}
.countdown b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.countdown span{font-size:15px;color:var(--muted)}
.gsearch{max-width:520px}
.tasks-up{display:flex;flex-direction:column;max-width:720px}
.tup{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.tup-main{flex:1;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0}
.tup-when{font-size:12px;color:var(--muted)}
.tup.late .tup-when{color:#B4413C;font-weight:500}
.tup-label{font-size:16px}
.tup-look{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tup-look .dot{width:8px;height:8px;flex:0 0 8px}
.tick-btn{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--mat);padding:0;position:relative;margin-top:2px}
.tick-btn:hover{border-color:var(--accent)}
.tick-btn.on{background:var(--accent);border-color:var(--accent)}
.tick-btn.on::after,.tick-btn:hover::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tick-btn.on::after{border-color:var(--paper)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:24px 1fr 150px 28px;gap:8px;align-items:center}
.task.done .in[data-tl]{text-decoration:line-through;color:var(--muted)}
.task .in{padding:7px 9px}
.task .x,.cmt .x{border:0;background:none;color:var(--muted);font-size:18px}
@media (max-width:640px){.task{grid-template-columns:24px 1fr 28px}.task .in[data-td]{grid-column:2/3;grid-row:2}}
.cost-line{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.cost-pay{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini-seg button{padding:3px 10px;font-size:12px}
.cost-pay .dep{width:150px;padding:5px 9px;font-size:13px}
.paidline{font-size:13px;color:var(--muted);margin-top:4px}
.vchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--mat);border-radius:10px;padding:6px 12px;font-size:13px;line-height:1.25}
.vchip small{font-size:11px;color:var(--muted)}
.vchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vchip[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.btn.wa{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;background:#1F9D55;border-color:#1F9D55}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.vd-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.vd-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.bar-row small{font-size:12px;color:var(--muted)}
.bar{position:relative}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.bar-row.over .bar i{background:#B4413C}
.bar-row.over .amt{color:#B4413C}
.split.over b{color:#B4413C}
.cmts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cmt{background:var(--mat);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)}
.cmt.mine{background:color-mix(in srgb,var(--accent) 10%,var(--mat))}
.cmt-h{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.cmt-h b{color:var(--ink);font-weight:500;font-size:13px}
.cmt-h .x{margin-left:auto;padding:0 2px;font-size:16px}
.cmt-t{font-size:14px;margin-top:2px;word-wrap:break-word}
.cmt-new{display:flex;gap:8px;align-items:flex-end}
.cmt-new textarea{flex:1;min-height:44px}
.dr-foot{justify-content:space-between}
.aso{margin:40px 0 10px;border:1px solid var(--line);background:var(--mat);border-radius:10px;padding:0 18px}
.aso summary{cursor:pointer;list-style:none;padding:16px 0;display:flex;flex-direction:column;gap:2px}
.aso summary::-webkit-details-marker{display:none}
.aso summary span{font-family:var(--display);font-size:26px}
.aso summary span::after{content:" +";font-family:var(--body);font-size:18px;color:var(--muted)}
.aso[open] summary span::after{content:" −"}
.aso summary small{font-size:13px;color:var(--muted)}
.aso-grid{display:grid;grid-template-columns:1fr minmax(220px,340px);gap:24px;padding-bottom:20px}
.aso-fields{display:flex;flex-direction:column;gap:10px}
.aso-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.aso-pics>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.aso-pic{width:64px;height:64px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--paper)}
.aso-pic img{width:100%;height:100%;object-fit:cover}
.aso-pic span{font-size:12px;color:var(--muted)}
.aso-pic.on{border-color:var(--ink)}
.aso-pic.up{border:1.5px dashed var(--line)}
.aso-sec{min-width:0;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
.aso-sec legend{padding:0 6px;font-family:var(--display);font-size:20px}
.aso-sec .in,.aso-fields .in{width:100%;box-sizing:border-box}
.aso-sec label{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.aso-view{margin-top:6px}
.aso-prev{position:sticky;top:16px;align-self:start}
@media (max-width:760px){.aso-prev{position:static}}
.aso-prev canvas{width:100%;height:auto;display:block;box-shadow:var(--shadow);border-radius:4px}
.aso-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media (max-width:760px){.aso-grid{grid-template-columns:1fr}}
/* Card buttons */
.look{position:relative}
.look:focus-within{transform:rotate(0deg)}
.photo{display:block;width:100%;border:0;padding:0;cursor:zoom-in}
.photo[data-open]{cursor:pointer}
.thumb{position:relative;border:0;padding:0;background:none;width:52px;cursor:zoom-in;text-align:center}
.thumb img{width:52px;height:52px;object-fit:cover}
.thumb .figcap{display:block;font-size:10px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;cursor:pointer}
.edit-pen{position:absolute;top:18px;right:18px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:var(--mat);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .15s}
.look:hover .edit-pen,.edit-pen:focus-visible{opacity:1}
@media (hover:none){.edit-pen{opacity:.95}}
.zoomable{cursor:zoom-in}
/* Picture viewer */
.lb{position:fixed;inset:0;z-index:97;background:#141014;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px}
.lb-title{font-family:var(--display);font-size:26px;line-height:1.15}
.lb-meta{font-size:13px;opacity:.7;margin-top:2px}
.lb-close{border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;flex:0 0 auto}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.lb-stage img{max-width:min(100%,1100px);max-height:100%;object-fit:contain;flex:0 1 auto;min-width:0;border-radius:2px}
.lb-nav{flex:0 0 auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1}
.lb.single .lb-nav{visibility:hidden}
.lb-bar{display:flex;justify-content:center;padding:16px}
.lb-bar .btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1e1a1d;border-color:#fff}
@media (max-width:640px){.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35)}#lbPrev{left:8px}#lbNext{right:8px}.lb-stage{position:relative;padding:0}}
/* AI stylist */
.ai-fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:65;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);padding:12px 18px;font-size:14px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
.ai-fab:hover{transform:translateY(-1px)}
body.ai-open .ai-fab,body.dr-open .ai-fab{display:none}
@media (max-width:640px){.ai-fab span{display:none}.ai-fab{padding:14px}body:has(.drawer.on) .ai-fab{display:none}}
.ai-scrim{position:fixed;inset:0;z-index:98;background:rgba(20,15,20,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.ai-scrim.on{opacity:1;pointer-events:auto}
.ai{position:fixed;top:0;right:0;bottom:0;z-index:99;width:min(440px,100%);background:var(--paper);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility .28s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 40px -20px rgba(0,0,0,.35)}
.ai.on{transform:none;visibility:visible}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ai-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:26px;line-height:1.1}
.ai-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ai-head-btns{display:flex;align-items:center;gap:6px}
.ai-x{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.ai-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.ai-empty{color:var(--muted);font-size:15px;max-width:34ch}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:4px 0 6px;padding-left:18px}.msg li{margin:2px 0}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--mat);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg.err{color:#B4413C}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.ai-chips:empty{display:none}
.ai-chips button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:7px 12px;font-size:13px;text-align:left}
.ai-chips button:hover{border-color:var(--ink)}
.ai-form{display:flex;gap:8px;align-items:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.ai-form textarea{flex:1;resize:none;min-height:42px;max-height:140px;line-height:1.4}
.ask-look{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;margin-bottom:18px;color:var(--ink)}
.ask-look:hover{border-color:var(--ink)}
/* By person */
.ov-wide{max-width:none}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:14px;scrollbar-width:thin}
.pchips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:8px 14px;font-size:14px}
.pchips button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchips button.zero{opacity:.55}
.pchips button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1}
.pchips button[aria-selected="true"] span{color:var(--paper);opacity:.75}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;border:0;padding:8px 8px 12px;background:var(--mat);box-shadow:var(--shadow);cursor:zoom-in}
.pcard[data-open]{cursor:pointer}
.pimg{display:block;aspect-ratio:3/4;background:color-mix(in srgb,var(--ink) 6%,transparent);overflow:hidden;position:relative;margin-bottom:6px}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.pocc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pocc .dot{width:8px;height:8px;flex:0 0 8px}
.ptitle{font-size:15px;line-height:1.3}
.pmeta{font-size:12px;color:var(--muted)}
@media (max-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.ai-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ai-row .ask-look{margin-bottom:0}
.ask-look.fill{border-style:solid;border-color:var(--ink);font-weight:400}
.ask-look:disabled{opacity:.6}
/* Tags */
.tagbtn{position:absolute;top:4px;left:4px;right:4px;border:0;border-radius:3px;background:var(--mat);font-size:11px;line-height:1.3;padding:3px 5px;text-align:left;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagbtn.has{color:var(--ink)}
.tg-hint{margin:-8px 0 14px;color:var(--muted);font-size:14px}
.tg-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tg-opts button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:8px 14px;font-size:15px}
.tg-opts .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;position:relative}
.tg-opts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tg-opts button[aria-pressed="true"] .tick{border-color:var(--paper);background:var(--paper)}
.tg-opts button[aria-pressed="true"] .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
/* Color picker */
.cp-scrim{position:fixed;inset:0;background:rgba(20,15,20,.4);z-index:95;opacity:0;pointer-events:none;transition:opacity .2s}
.cp-scrim.on{opacity:1;pointer-events:auto}
.cp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:96;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--paper);border-radius:10px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.cp[hidden]{display:none}
.cp h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 16px}
.cp-prev{display:flex;gap:16px;align-items:stretch;margin-bottom:18px}
#cpSw{flex:0 0 96px;height:96px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cp-fields{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cp-fields label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.cp-fields label[hidden]{display:none}
.cp-fields .in{padding:7px 10px;font-size:14px}
.cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:14px}
.cp-grid button{aspect-ratio:1;border-radius:50%;border:0;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);padding:0}
.cp-grid button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.cp-custom{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-bottom:20px}
.cp-rainbow{position:relative;width:32px;height:32px;border-radius:50%;background:conic-gradient(#e33,#ec3,#3c5,#3ce,#35e,#c3e,#e33);overflow:hidden}
.cp-rainbow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.cp-actions{display:flex;gap:8px;align-items:center}
.cp-actions .sp{flex:1}
.cp-actions [hidden]{display:none}
/* Account */
.acct{margin-top:6px;font-size:11px;color:var(--muted);word-break:break-all}
.acct button{background:none;border:0;padding:0;font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
/* Presence */
.presence{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.4}
.presence i{flex:0 0 7px;height:7px;border-radius:50%;background:var(--line);margin-top:5px}
.presence.on{color:var(--ink)}
.presence.on i{background:#3BA55C;box-shadow:0 0 0 3px color-mix(in srgb,#3BA55C 25%,transparent)}
.peer-note{background:var(--mat);border-left:2px solid #3BA55C;padding:8px 12px;font-size:13px;margin:0 0 16px}
/* Palette, dates */
.pal{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.pchip{position:relative;width:84px;font-size:12px;line-height:1.3}
.psw{position:relative;display:block;border:0;padding:0;width:84px;height:84px;border-radius:4px;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);margin-bottom:6px;cursor:pointer;overflow:hidden}
.psw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.psw:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pname{display:block}
.phex{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-top:2px}
.prm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--mat);font-size:14px;line-height:1;opacity:0;transition:opacity .15s;z-index:2}
.pchip:hover .prm,.prm:focus-visible{opacity:1}
@media (hover:none){.prm{opacity:.9}}
.padd-tile{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:4px;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.padd-tile span{font-size:24px;line-height:1;font-weight:300}
.padd-tile:hover{border-color:var(--ink);color:var(--ink)}
.muted{color:var(--muted);font-size:14px}
.chmeta{display:grid;grid-template-columns:200px 1fr;gap:20px 48px;margin:-8px 0 40px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin:0 0 10px}
.date-in{max-width:200px}
.sub-h.first{margin-top:0}
.ov{margin-bottom:48px;max-width:900px}
.date-row{display:grid;grid-template-columns:12px minmax(140px,1fr) 180px minmax(60px,auto) 120px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.date-row .amt{text-align:right;font-variant-numeric:tabular-nums}
.mini-pal{display:flex;gap:4px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:400}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.sub-h.sm{font-size:22px;margin-top:40px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:760px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:640px){.chmeta{grid-template-columns:1fr}.date-row{grid-template-columns:12px 1fr auto;row-gap:8px}.date-row .date-in{grid-column:2/4;max-width:none}.date-row .mini-pal{grid-column:2}.date-row .amt{grid-column:3}}
.sync{display:block;margin-top:12px;background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-align:left}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--muted);vertical-align:1px}
.sync[data-st="saved"]::before{background:var(--accent)}
.sync[data-st="signin"],.sync[data-st="error"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sync[data-st="signin"]::before,.sync[data-st="error"]::before{background:#B4413C}
.share-msg{font-size:14px;margin:0 0 10px;min-height:1em}
.people{list-style:none;padding:0;margin:0 0 14px;font-size:14px;display:flex;flex-direction:column;max-width:520px}
.people li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.people li span:first-child{word-break:break-all}
.people .role{color:var(--muted);font-size:13px;white-space:nowrap}
.share-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.share-row .in{max-width:300px}
.gate{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;place-items:center;padding:24px}
.gate.on{display:grid}
.gate-card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;margin:0 0 4px}
.gate-card p{margin:0 0 8px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.col,main{min-width:0;max-width:100vw}
  .head h1{font-size:clamp(38px,11vw,60px)}
  .head{margin-bottom:22px}
  .actions .btn{padding:8px 14px}
  .board{columns:2 150px;column-gap:16px}
  .look{margin-bottom:22px;transform:rotate(calc(var(--tilt,0deg)*.5))}
  .mat{padding:8px 8px 10px}
  .cap h3{font-size:15px}
  .price{font-size:18px}
  .lines{display:none}
  .chmeta{padding:16px 0;margin-bottom:28px}
  .big{font-size:clamp(40px,13vw,64px)}
  .bar-row{grid-template-columns:1fr auto;gap:6px 12px}
  .bar-row .bar{grid-column:1/3;grid-row:2}
  .bar-row .amt{min-width:0}
  .split{min-width:0;flex:1 1 calc(50% - 14px);padding:12px 14px}
  .split b{font-size:20px}
  .credit{padding:18px 16px 24px}
  /* stop iPhone/iPad from zooming in when typing */
  input,select,textarea,.in,.pname,.cp-fields .in,.share-row .in{font-size:16px!important}
  .mbar{display:flex}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:75;background:var(--paper);transform:translateX(-102%);visibility:hidden;transition:transform .26s ease,visibility .26s;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:20px 0 40px -20px rgba(0,0,0,.35)}
  body.nav-open .side{transform:none;visibility:visible}
  body.nav-open .navscrim{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  .side-foot{max-width:none}
  .presence{justify-content:flex-start;text-align:left}
  main{padding-top:28px}
}
@media (max-width:420px){.board{columns:1}.lines{display:block}}
@media (min-width:861px){.side-top{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.look{transform:none}}
</style>
</head>

  <div class="lb-bar"><button class="btn primary" id="lbEdit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg> Edit details</button></div>
</div>
<button class="ai-fab" id="aiFab" aria-label="Ask the stylist"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></svg><span>Ask the stylist</span></button>
<div class="ai-scrim" id="aiScrim"></div>
<aside class="ai" id="ai" role="dialog" aria-label="Wedding stylist chat" aria-hidden="true">
  <div class="ai-head"><div><div class="ai-title"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></svg> Stylist</div><div class="ai-sub" id="aiSub">Knows your looks, colors, dates and costs</div></div><div class="ai-head-btns"><button class="btn small ghost" id="aiClear">Clear</button><button class="lb-close ai-x" id="aiClose" aria-label="Close">×</button></div></div>

</aside>

  <div class="sr-top"><input id="srIn" class="in" type="search" placeholder="Search looks, plan, people, vendors, tasks…" autocomplete="off"><button type="button" class="btn small ghost" id="srClose">Close</button></div>
  <div class="sr-res" id="srRes"></div>
</div>
<div class="cp-scrim" id="ppScrim"></div>
<div class="cp" id="pp" role="dialog" aria-modal="true" aria-labelledby="ppTitle" hidden>
  <h2 id="ppTitle">Colors from your picture</h2>
  <p class="tg-hint">Tap to choose which to add.</p>
  <div class="pp-list" id="ppList"></div>
  <div class="cp-actions"><span class="sp"></span><button type="button" class="btn" id="ppCancel">Cancel</button><button type="button" class="btn primary" id="ppOk">Add to palette</button></div>
</div>

  <h2 id="vdTitle">New vendor</h2>
  <div class="vd-fields">
    <label>Name<input id="vdName" class="in" placeholder="e.g. Ade Tailoring" maxlength="60"></label>
    <label>Role<input id="vdRole" class="in" list="vdRoles" placeholder="e.g. Tailor" maxlength="40"></label>
    <datalist id="vdRoles"><option>Tailor</option><option>Fashion designer</option><option>Fabric seller</option><option>Cobbler</option><option>Gele stylist</option><option>Makeup artist</option><option>Hair stylist</option><option>Jeweler</option><option>Photographer</option></datalist>
    <label>Phone (with country code)<input id="vdPhone" class="in" type="tel" placeholder="+234 803 123 4567" maxlength="30"></label>

  </div>

<script>
const CH=[
 {id:'court',name:'Court wedding',color:'#8FA3B3',note:'Simple, tailored looks for the registry.'},
 {id:'prewedding',name:'Pre-wedding shoot',color:'#9DAE8C',slots:3,note:'Three outfits for the photo shoot.'},
 {id:'introduction',name:'Introduction',color:'#C7899B',note:'Family-coordinated colors and attire.'},
 {id:'traditional',name:'Traditional marriage',color:'#7A2E3A',note:'Traditional attire, beads and accessories.'},
 {id:'church',name:'Church wedding',color:'#CDBFA8',note:'Gown, suit and veil.'}
];
const FIELDS=[['outfit','Outfit & fabric'],['accessories','Accessories'],['shoes','Shoes'],['beauty','Hair & makeup'],['notes','Notes']];
const WHO=['Bride','Groom','Both','Best man','Maid of honor','Groomsmen','Bridesmaids','Family'];
const TAGS=['Bride','Groom','Best man','Maid of honor','Groomsmen','Bridesmaids','Family'];
const STATUS=['Idea','Chosen','Sourcing','Ready'];
const CURS={NGN:'Naira (₦)',EUR:'Euro (€)',USD:'Dollar ($)',GBP:'Pound (£)'};
const DEFAULT_COSTS=[{label:'Outfit',amount:''},{label:'Shoes',amount:''},{label:'Accessories',amount:''}];

const S={overview:{palette:[]},chapters:{},looks:new Map(),currency:'NGN',active:'overview',open:null,mode:'local',canWrite:true,canUpload:true};
S.chapters=Object.fromEntries(CH.map(c=>[c.id,{palette:[],date:''}]));
const metaObj=k=>k==='overview'?S.overview:S.chapters[k];
const VCAT=['Event centre','Decoration','Photography','Videography','Makeup','Hair','Content creator','Cake','Food & drinks','Small chops','DJ / live band','MC','Souvenirs','Graphics & IV','Rentals','Security & ushers','Transport','Planner','Tailor','Fabric seller','Gele stylist','Jeweler','Other'];
const VSTATUS=['Shortlisted','Contacted','Quoted','Booked','Paid','Done'];
const PROLE=['Bride','Groom','Maid of honor','Chief bridesmaid','Best man','Bridesmaid','Groomsman','Little bride','Parent','Family','Friend','Vendor liaison','Other'];
const PDUTY=['Rings','Transport','Guests & ushering','Gifts','Drinks','Food service','Photography','Music & MC','Security','Decoration','Money & payments','Errands'];
const TWHO=['Bride','Groom','Both','Family'];
const HC=()=>!S.canWrite; // viewers never see costs
const noCost=()=>S.noCosts||HC();
const LOOKPAGES=()=>['overview','inbox','summary',...CH.map(c=>c.id)];
const isLooksPage=pg=>LOOKPAGES().includes(pg);
try{S.noCosts=localStorage.getItem('wl-nocosts')==='1'}catch{}
const custom=()=>S.plan.custom||(S.plan.custom={duties:[],roles:[]});
const allDuties=()=>[...new Set([...PDUTY,...(custom().duties||[]),...Object.values(S.people).flatMap(p=>p.duties||[])])];
const allRoles=()=>[...new Set([...PROLE,...(custom().roles||[]),...Object.values(S.people).map(p=>p.role).filter(Boolean)])];
const ROLEGROUP={'Bride':['Bride'],'Groom':['Groom'],'Best man':['Best man'],'Maid of honor':['Maid of honor'],'Chief bridesmaid':['Maid of honor','Bridesmaids'],'Groomsman':['Groomsmen'],'Bridesmaid':['Bridesmaids'],'Little bride':['Bridesmaids'],'Parent':['Family'],'Family':['Family']};
const looksForPerson=p=>{const gs=ROLEGROUP[p.role]||[];return gs.length?CH.flatMap(c=>byChapter(c.id).filter(l=>gs.some(g=>l.who===g||(l.images||[]).some(im=>tagsOf(l,im).includes(g)))).map(l=>({l,c}))):[]};
const peopleForGroup=g=>pAll().filter(p=>(ROLEGROUP[p.role]||[]).includes(g));
const peopleForLook=l=>{const gs=new Set([l.who,...(l.images||[]).flatMap(im=>tagsOf(l,im))]);return pAll().filter(p=>(ROLEGROUP[p.role]||[]).some(g=>gs.has(g)))};
const MENR=['Best man','Groomsman'],WOMR=['Maid of honor','Chief bridesmaid','Bridesmaid'];
const cDue=p=>p.contrib!==undefined&&p.contrib!==''?num(p.contrib):num((S.plan.contrib||{})[MENR.includes(p.role)?'men':WOMR.includes(p.role)?'women':'-']);
const cPaid=p=>num(p.contribPaid),cOwes=p=>Math.max(0,cDue(p)-cPaid(p));
const cTotals=()=>{const a=pAll().filter(p=>cDue(p)>0);return {n:a.length,paidN:a.filter(p=>!cOwes(p)).length,due:a.reduce((x,p)=>x+cDue(p),0),got:a.reduce((x,p)=>x+Math.min(cDue(p),cPaid(p)),0),owing:a.filter(p=>cOwes(p))}};
const vByCat=()=>{const a=vAll();const ix=c=>{const i=VCAT.indexOf(c);return i<0?999:i};return a.sort((x,y)=>ix(vCat(x))-ix(vCat(y))||vCat(x).localeCompare(vCat(y))||(x.name||'').localeCompare(y.name||''))};
const pAll=()=>Object.entries(S.people).map(([id,p])=>({id,...p})).sort((a,b)=>(a.order||0)-(b.order||0));
const vAll=()=>Object.entries(S.vendors).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0)||(a.name||'').localeCompare(b.name||''));
const tAll=()=>Object.entries(S.tasks).map(([id,t])=>({id,...t}));
const vCat=v=>v.cat||v.role||'Other';
const vQuote=v=>num(v.quote),vPaid=v=>num(v.paid);
const vTotals=()=>{const a=vAll();return{quoted:a.reduce((x,v)=>x+vQuote(v),0),paid:a.reduce((x,v)=>x+vPaid(v),0)}};
const committed=()=>grandTotal()+vTotals().quoted+planTotals().cost;
const whoLabel=v=>{if(!v)return 'Both';if(v.slice(0,2)==='p:'){const p=S.people[v.slice(2)];return p?(p.name||'Unnamed'):'Unassigned'}return v};
const tasksFor=pid=>tAll().filter(t=>t.who==='p:'+pid).sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1);
const newPerson=(name='',role='Bridesmaid')=>({name,role,duties:[],days:[],phone:'',notes:'',order:Date.now()+Math.random(),createdAt:new Date().toISOString()});
const newVendor=()=>({name:'',cat:VCAT[0],days:[],status:'Shortlisted',phone:'',link:'',quote:'',paid:'',notes:'',images:[],order:Date.now()+Math.random(),createdAt:new Date().toISOString()});
const RK={person:{m:()=>S.people,p:'p:'},vendor:{m:()=>S.vendors,p:'v:'},task:{m:()=>S.tasks,p:'t:'},plan:{m:()=>S.items,p:'i:'},guest:{m:()=>S.guests,p:'g:'},run:{m:()=>S.run,p:'r:'},gift:{m:()=>S.gifts,p:'f:'}};
const KLABEL={person:'Person',vendor:'Vendor',task:'To-do',plan:'Plan item',guest:'Guest',run:'Timeline entry',gift:'Gift'};
function rnew(kind,data){if(!S.canWrite){toast('You have view-only access.');return null}const id=kind[0]+rid();RK[kind].m()[id]={...data,by:myId(),byName:myName(),updatedAt:Date.now()};markDirty();return id}
function rchange(kind,id,fn,{redraw=true}={}){if(!S.canWrite){toast('You have view-only access.');return}const o=RK[kind].m()[id];if(!o)return;fn(o);o.updatedAt=Date.now();o.by=myId();o.byName=myName();if(redraw)render();else renderSide();markDirty()}
function rdelete(kind,id){if(!S.canWrite)return;const keep=RK[kind].m()[id];delete RK[kind].m()[id];D.deleted[RK[kind].p+id]=Date.now();if(keep)setTimeout(()=>offerUndo(`${KLABEL[kind]} removed.`,()=>{RK[kind].m()[id]={...keep,updatedAt:Date.now()};delete D.deleted[RK[kind].p+id]}),0);if(kind==='vendor'){for(const [,l] of S.looks)if((l.vendors||[]).includes(id)){l.vendors=l.vendors.filter(x=>x!==id);l.updatedAt=Date.now()}}if(kind==='person'){for(const t of Object.values(S.tasks))if(t.who==='p:'+id){t.who='Both';t.updatedAt=Date.now()}}render();markDirty()}
function changePlan(fn){if(!S.canWrite){toast('You have view-only access.');return}fn(S.plan);S.plan.updatedAt=Date.now();render();markDirty()}

const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'})};
const D={deleted:{}};S.items={};S.guests={};S.run={};S.gifts={};S.people={};S.tasks={};S.plan={budget:0,custom:{duties:[],roles:[]},updatedAt:0};S.noCosts=false;S.vfilter='all';S.vendors={};S.comments={};S.hearts={};S.flt={q:'',status:'',person:'',fav:''};S.gq='';S.mode='drive';S.sync='signin';S.settingsAt=0;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const lookTotal=l=>(l.costs||[]).reduce((a,c)=>a+num(c.amount),0);
const lineOwed=r=>r.status==='paid'?0:r.status==='deposit'?Math.max(0,num(r.amount)-num(r.paid)):num(r.amount);
const lookOwed=l=>(l.costs||[]).reduce((a,r)=>a+lineOwed(r),0);
const lookPaid=l=>lookTotal(l)-lookOwed(l);
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const daysUntil=d=>{if(!d)return null;const t=new Date(d+'T00:00:00');if(isNaN(t))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)};
const cdText=n=>n==null?'':n===0?'Today':n===1?'Tomorrow':n>1?`in ${n} days`:n===-1?'Yesterday':`${-n} days ago`;
const shortDate=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const myId=()=>((typeof me!=='undefined'&&me&&me.emailAddress)||localStorage.getItem('wl-email')||'me').toLowerCase();
const myName=()=>{const n=(typeof me!=='undefined'&&me&&me.displayName)||'';return (n.split(' ')[0])||myId().split('@')[0]};
const heartsFor=id=>Object.values(S.hearts||{}).filter(h=>h&&h.lookId===id&&h.on);
const iLove=id=>!!((S.hearts||{})[id+'~'+myId()]||{}).on;
const commentsFor=id=>Object.entries(S.comments||{}).filter(([,c])=>c&&c.lookId===id).map(([cid,c])=>({cid,...c})).sort((a,b)=>a.at-b.at);
const lookFor=(l,person)=>l.who===person||(l.who==='Both'&&(person==='Bride'||person==='Groom'))||(l.images||[]).some(im=>tagsOf(l,im).includes(person));
const waNum=ph=>{let d=String(ph||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);d=d.replace(/\D/g,'');if(d.startsWith('00'))return d.slice(2);if(d.startsWith('0')&&d.length===11)return '234'+d.slice(1);return d};
function lookMatches(l,f){
  if(f.status&&(l.status||'Idea')!==f.status)return false;
  if(f.person&&!lookFor(l,f.person))return false;
  if(f.fav==='me'&&!iLove(l._id||''))return false;
  if(f.fav==='both'&&heartsFor(l._id||'').length<2)return false;
  const q=(f.q||'').trim().toLowerCase();if(!q)return true;
  const c=CH.find(x=>x.id===l.chapter);
  const vend=(l.vendors||[]).map(v=>(S.vendors[v]||{}).name||'').join(' ');
  const tags=(l.images||[]).flatMap(im=>tagsOf(l,im)).join(' ');
  const pal=[...((S.chapters[l.chapter]||{}).palette||[])].filter(p=>(l.colors||[]).map(x=>x.toLowerCase()).includes(String(p.hex).toLowerCase())).map(p=>p.name).join(' ');
  const hay=[l.title,l.who,l.status,l.outfit,l.accessories,l.shoes,l.beauty,l.notes,(l.colors||[]).join(' '),c&&c.name,vend,tags,pal].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}

const tagsOf=(l,id)=>{const v=(l.imageTags||{})[id];return Array.isArray(v)?v:(v?[v]:[])};
const tagOf=(l,id)=>tagsOf(l,id).join(', ');

const chTotal=ch=>byChapter(ch).reduce((a,l)=>a+lookTotal(l),0);
const grandTotal=()=>[...S.looks.values()].filter(l=>l.chapter!=='inbox').reduce((a,l)=>a+lookTotal(l),0);

function tasksHTML(){

function parseCSV(text){const rows=[];let r=[],c='',q=false;text=text.replace(/^﻿/,'');for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;r.push(c);c='';if(r.some(v=>v!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(v=>v!==''))rows.push(r);return rows}
function importPlanCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('That file looks empty.');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());const col=n=>head.findIndex(h=>h.startsWith(n));
  const ci={sec:col('section'),item:col('item'),st:col('status'),ch:col('ceremony'),who:col('who'),bud:col('budget'),sp:col('spent'),notes:col('notes')};
  if(ci.item<0){toast('This file needs an "Item" column.');return}
  const chMap={introduction:'introduction',court:'court',traditional:'traditional',church:'church'};
  const whoMap=w=>{w=(w||'').trim();if(/^both$/i.test(w)||!w)return 'Both';if(/janet|bride/i.test(w))return 'Bride';if(/emmanuel|made|groom/i.test(w))return 'Groom';return w};
  const have=new Set(iAll().map(x=>(x.section||'')+'|'+(x.item||'')));let n=0,base=Date.now();
  rows.slice(1).forEach((r,k)=>{const g=i=>i>=0?(r[i]||'').trim():'';const item=g(ci.item);if(!item)return;const section=g(ci.sec)||'Other';if(have.has(section+'|'+item))return;
    let st=g(ci.st);st=ISTATUS.find(s=>s.toLowerCase()===st.toLowerCase())||'Not discussed';let notes=g(ci.notes);let checks=[];
    if(/list|box items|\bkit\b/i.test(item)&&notes.split(/[,;]/).length>=3){checks=notes.replace(/^[^:]{0,24}:\s*/,m=>/^(fabrics|set of boxes)/i.test(m)?'':m).split(/[,;]/).map(t=>t.trim().replace(/\.$/,'')).filter(Boolean).map(t=>({t:t.charAt(0).toUpperCase()+t.slice(1),done:false,cost:''}));notes=''}
    const id='i'+rid();S.items[id]={section,item,status:st,ch:chMap[g(ci.ch).toLowerCase()]||'',who:whoMap(g(ci.who)),budget:g(ci.bud).replace(/[^\d.]/g,''),spent:g(ci.sp).replace(/[^\d.]/g,''),notes,checks,order:base+k,by:myId(),byName:myName(),updatedAt:Date.now()};n++});
  render();markDirty();toast(n?`Imported ${n} items into your plan`:'Nothing new to import');
}

function normAso(a){
  a=a||{};const sec={...(a.sec||{})};
  if(!sec.Ladies&&(a.ladies||a.fabric||a.price||a.pic))sec.Ladies=a.ladies||{fabric:a.fabric,price:a.price,pic:a.pic};
  if(!sec.Gentlemen&&a.men)sec.Gentlemen=a.men;
  let groups=Array.isArray(a.groups)?a.groups.filter(g=>CARD_GROUPS.includes(g)):null;
  if(!groups)groups=a.view==='ladies'?['Ladies']:a.view==='men'?['Gentlemen']:(a.ladies||a.men||a.fabric)?['Ladies','Gentlemen']:[];
  return {groups,sec};
}

    const list=cur&&!all.includes(cur)?[cur,...all]:all;
    return `<div class="aso-pics"><span class="mini">Picture idea</span><div><button type="button" class="aso-pic${!cur?' on':''}" data-ae-pic="${c.id}|${g}|"><span>None</span></button>${list.map(im=>`<button type="button" class="aso-pic${cur===im?' on':''}" data-ae-pic="${c.id}|${g}|${im}"><img ${imgAttr(im)} alt=""></button>`).join('')}<button type="button" class="aso-pic up" data-ae-up="${c.id}|${g}" aria-label="Upload a picture"><span>+ Upload</span></button></div></div>`};

    <label>Price (optional)<input class="in" data-ae-g="${c.id}|${g}|price" value="${esc(x.price||'')}" placeholder="e.g. ₦45,000 per set"></label>

    <div><span class="mini">Who is this card for? (up to 4)</span><div class="chips aso-groups">${CARD_GROUPS.map(g=>`<button type="button" class="vchip" data-ae-grp="${c.id}|${g}" aria-pressed="${groups.includes(g)}">${g}</button>`).join('')}</div></div>
    ${groups.map(secHTML).join('')||'<p class="muted" style="margin:0">Pick at least one person or group above.</p>'}
    <label>How to order<input class="in" data-ae="${c.id}|contact" value="${esc(a.contact||'')}" placeholder="e.g. Call Aunty Grace, 0803 123 4567"></label>
    <label>Note<input class="in" data-ae="${c.id}|note" value="${esc(a.note||'')}" placeholder="e.g. Order by 30 November"></label>
  </div><div class="aso-prev"><canvas id="aeCanvas" width="1080" height="1350" aria-label="Card preview"></canvas>
    <div class="aso-btns"><button class="btn primary" data-ae-dl="${c.id}">Download card</button>${navigator.share?`<button class="btn" data-ae-share="${c.id}">Share</button>`:''}</div></div></div></details>`;
}

function summaryHTML(){
  const g=grandTotal();const max=Math.max(1,...CH.map(c=>chTotal(c.id)));
  const all=[...S.looks.entries()].map(([id,l])=>({id,...l})).filter(l=>l.chapter!=='inbox');
  const sumBy=(k,v)=>all.filter(l=>(l[k]||'')===v).reduce((a,l)=>a+lookTotal(l),0);
  const rows=CH.flatMap(c=>byChapter(c.id).map(l=>`<tr><td>${c.name}</td><td><button data-open="${l.id}" data-goto="${c.id}">${esc(l.title||'Untitled look')}</button></td><td>${esc(l.who||'')}</td><td>${esc(l.status||'Idea')}</td><td class="n">${money(lookTotal(l))}</td></tr>`)).join('');
  return `<header class="head"><div><h1>Cost summary</h1><div class="meta">${all.length} looks across ${CH.length} ceremonies</div></div><div class="actions"><button class="btn primary" data-pdf>Export PDF</button></div></header>
  <div class="grand-label">Everything together</div><div class="big">${money(g)}</div>
  ${(()=>{const paid=all.reduce((a,l)=>a+lookPaid(l),0),owed=all.reduce((a,l)=>a+lookOwed(l),0),bud=CH.reduce((a,c)=>a+num((S.chapters[c.id]||{}).budget),0);return `<div class="splits" style="margin-bottom:34px"><div class="split"><span>Paid</span><b>${money(paid)}</b></div><div class="split"><span>Still to pay</span><b>${money(owed)}</b></div>${bud?`<div class="split${g>bud?' over':''}"><span>Total budget</span><b>${money(bud)}</b></div>`:''}</div>`})()}
  <div class="bars">${CH.map(c=>{const t=chTotal(c.id),b=num((S.chapters[c.id]||{}).budget);const ref=Math.max(max,...CH.map(x=>num((S.chapters[x.id]||{}).budget)));return `<div class="bar-row${b&&t>b?' over':''}" style="--c:${c.color}"><span>${c.name}${b?`<small> of ${money(b)}</small>`:''}</span><div class="bar">${b?`<em style="left:${b/ref*100}%"></em>`:''}<i style="width:${t/ref*100}%"></i></div><span class="amt">${money(t)}</span></div>`}).join('')}</div>
  <h2 class="sub-h">By person</h2>
  ${(()=>{const ws=[...new Set([...WHO,...all.map(l=>l.who||'Both')])].map(w=>{const ls=all.filter(l=>(l.who||'Both')===w);return {w,n:ls.length,t:ls.reduce((a,l)=>a+lookTotal(l),0),p:ls.reduce((a,l)=>a+lookPaid(l),0),o:ls.reduce((a,l)=>a+lookOwed(l),0)}}).filter(x=>x.n);
    if(!ws.length)return '<p class="muted">No looks yet.</p>';
    const tt=ws.reduce((a,x)=>a+x.t,0),tp=ws.reduce((a,x)=>a+x.p,0),to=ws.reduce((a,x)=>a+x.o,0);
    return `<div class="tbl-wrap"><table><thead><tr><th>For</th><th class="n">Looks</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Still to pay</th></tr></thead><tbody>${ws.map(x=>`<tr><td>${esc(x.w)}</td><td class="n">${x.n}</td><td class="n">${money(x.t)}</td><td class="n">${money(x.p)}</td><td class="n"><b style="font-weight:500">${money(x.o)}</b></td></tr>`).join('')}<tr><td><b style="font-weight:500">Total</b></td><td class="n">${ws.reduce((a,x)=>a+x.n,0)}</td><td class="n">${money(tt)}</td><td class="n">${money(tp)}</td><td class="n"><b style="font-weight:500">${money(to)}</b></td></tr></tbody></table></div><p class="muted" style="font-size:13px;margin-top:8px">Based on each look's "For" setting. Looks set to Both are counted under Both.</p>`})()}
  <h2 class="sub-h sm">How far along</h2>${(()=>{const col={Idea:'#D9D1D5',Chosen:'#A8854F',Sourcing:'#8A7F86',Ready:'var(--accent)'};const st=STATUS.map(x=>[x,all.filter(l=>(l.status||'Idea')===x).reduce((a,l)=>a+lookTotal(l),0)]);return `<div class="stack">${st.map(([x,v])=>v?`<i style="flex:${v};background:${col[x]}"></i>`:'').join('')}</div><div class="legend">${st.map(([x,v])=>`<span><i style="background:${col[x]}"></i>${x} ${money(v)}</span>`).join('')}</div>`})()}
  ${rows?`<h2 class="sub-h">Every look</h2><div class="tbl-wrap"><table><thead><tr><th>Ceremony</th><th>Look</th><th>For</th><th>Status</th><th class="n">Cost</th></tr></thead><tbody>${rows}<tr><td colspan="4"><b style="font-weight:500">Total</b></td><td class="n"><b style="font-weight:500">${money(g)}</b></td></tr></tbody></table></div>`:''}`;
}

let pendingMain=false;
const editingMain=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#main')&&a.matches('input,textarea,select'))};
function render(){renderSide();if(editingMain()){pendingMain=true;return}pendingMain=false;renderMain();hydrate();afterMain()}
function afterMain(){if(isLooksPage(S.active)&&!$('#main .looktabs')){$('#main').insertAdjacentHTML('afterbegin',lookTabsHTML());const a=$('#main .looktabs [aria-current="true"]');if(a&&a.scrollIntoView)try{a.scrollIntoView({block:'nearest',inline:'center'})}catch{}}lockRO($('#main'));const cv=$('#aeCanvas');if(cv&&CH.some(c=>c.id===S.active)){const det=cv.closest('details');if(det&&det.open)drawAso(S.active)}}
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('isec')){S.iopenS[e.target.dataset.isec]=e.target.open;return}if(e.target.classList&&e.target.classList.contains('aso')&&e.target.open)drawAso(S.active)},true);
document.addEventListener('focusout',e=>{if(!pendingMain)return;setTimeout(()=>{if(pendingMain&&!editingMain()){pendingMain=false;renderMain();hydrate();afterMain()}},0)});

/* ---------- Images ---------- */
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.86));
  }catch{return file}
}
async function storeImage(file){
  if(!folderId||!tokenOk())throw {code:'auth'};
  const b=await shrink(file);
  const id=await createFile({name:'look-'+Date.now()+'.jpg',parents:[folderId]},b);
  urlCache.set(id,URL.createObjectURL(b));cachePut(id,b);return id;
}

async function addImages(files,{lookId=null,chapter=S.active}={}){

  if(!files.length)return;
  if(!folderId||!tokenOk()){toast('Sign in with Google to add pictures.');return}
  if(!S.canWrite){toast('You have view-only access.');return}
  if(chapter==='summary'||chapter==='overview'){if(!lookId){chapter='inbox';toast('Added to your Ideas inbox')}else chapter='court'}
  toast(files.length>1?`Adding ${files.length} pictures`:'Adding picture');
  let made=null,autoFillTarget=null;
  for(const f of files){
    try{
      const imgId=await storeImage(f);
      if(lookId){const had=((S.looks.get(lookId)||{}).images||[]).length;change(lookId,l=>{l.images=[...(l.images||[]),imgId]},{redrawDrawer:true});if(!had&&!autoFillTarget)autoFillTarget=lookId}

  }

  else if(autoFillTarget&&S.open===autoFillTarget)aiFill(autoFillTarget,{auto:true});
}

/* Image cache (IndexedDB) */
let cdb=null;
function cacheDB(){if(cdb)return cdb;cdb=new Promise((res,rej)=>{const r=indexedDB.open('wl-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return cdb}

const loadingImg=new Map();
function ensureImg(id){
  if(urlCache.has(id))return Promise.resolve(urlCache.get(id));
  if(loadingImg.has(id))return loadingImg.get(id);
  const p=(async()=>{try{
    let b=await cacheGet(id);
    if(!b){if(!tokenOk())return null;b=await (await gfetch(`${API}/files/${id}?alt=media`)).blob();cachePut(id,b)}
    const u=URL.createObjectURL(b);urlCache.set(id,u);
    document.querySelectorAll('img[data-img]').forEach(i=>{if(i.dataset.img===id)i.src=u});return u;
  }catch{return null}finally{loadingImg.delete(id)}})();
  loadingImg.set(id,p);return p;
}

/* Drive API */
async function gfetch(url,opt={}){
  if(!tokenOk()){setSync('signin');throw {code:'auth'}}
  let r;try{r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}})}catch{throw {code:'offline'}}
  if(r.status===401){token=null;localStorage.removeItem('wl-token');setSync('signin');throw {code:'auth'}}
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
const jget=async u=>(await gfetch(u)).json();

async function createFile(meta,blob){
  const b='wl'+Math.random().toString(36).slice(2);
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return (await (await gfetch(`${UP}/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json()).id;
}

/* Document merge */
function toDoc(){const looks={};for(const [id,l] of S.looks)looks[id]=l;return {v:1,looks,deleted:D.deleted,overview:S.overview,chapters:S.chapters,settings:{currency:S.currency,updatedAt:S.settingsAt||0},vendors:S.vendors,comments:S.comments,hearts:S.hearts,people:S.people,tasks:S.tasks,plan:S.plan,items:S.items,guests:S.guests,run:S.run,gifts:S.gifts}}
function mergeMap(a,b,prefix,del){const out={};const ids=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);for(const id of ids){const w=newer((a||{})[id],(b||{})[id]);if(!w)continue;if(prefix&&(del[prefix+id]||0)>=(w.updatedAt||0))continue;out[id]=w}return out}
function newer(x,y){return !x?y:!y?x:((x.updatedAt||0)>=(y.updatedAt||0)?x:y)}
function mergeDocs(a,b){
  b=b||{};const out={v:1,looks:{},deleted:{...(b.deleted||{})},chapters:{}};
  for(const [k,t] of Object.entries(a.deleted||{}))out.deleted[k]=Math.max(t,out.deleted[k]||0);
  const ids=new Set([...Object.keys(a.looks||{}),...Object.keys(b.looks||{})]);
  for(const id of ids){const w=newer((a.looks||{})[id],(b.looks||{})[id]);if((out.deleted[id]||0)>=(w.updatedAt||0))continue;out.looks[id]=w}
  out.overview=newer(a.overview,b.overview);out.settings=newer(a.settings,b.settings);
  for(const c of CH)out.chapters[c.id]=newer((a.chapters||{})[c.id],(b.chapters||{})[c.id]);
  out.vendors=mergeMap(a.vendors,b.vendors,'v:',out.deleted);out.comments=mergeMap(a.comments,b.comments,'c:',out.deleted);out.hearts=mergeMap(a.hearts,b.hearts,'',out.deleted);out.people=mergeMap(a.people,b.people,'p:',out.deleted);out.tasks=mergeMap(a.tasks,b.tasks,'t:',out.deleted);out.plan=newer(a.plan,b.plan);out.items=mergeMap(a.items,b.items,'i:',out.deleted);out.guests=mergeMap(a.guests,b.guests,'g:',out.deleted);out.run=mergeMap(a.run,b.run,'r:',out.deleted);out.gifts=mergeMap(a.gifts,b.gifts,'f:',out.deleted);
  return JSON.parse(JSON.stringify(out));
}
function applyDoc(d){
  S.looks=new Map(Object.entries(d.looks||{}));D.deleted=d.deleted||{};
  S.overview={palette:[],...(d.overview||{})};
  for(const c of CH)S.chapters[c.id]={palette:[],date:'',...((d.chapters||{})[c.id]||{})};
  if(d.settings){S.currency=d.settings.currency||S.currency;S.settingsAt=d.settings.updatedAt||0}
  S.vendors=d.vendors||{};S.comments=d.comments||{};S.hearts=d.hearts||{};S.people=d.people||{};S.tasks=d.tasks||{};S.items=d.items||{};S.guests=d.guests||{};S.run=d.run||{};S.gifts=d.gifts||{};S.plan={budget:0,custom:{duties:[],roles:[]},updatedAt:0,...(d.plan||{})};
  saveLocal();
  if(R2.kind){if(!RK[R2.kind].m()[R2.id])closeR(true);else if(!$('#rdrawer').contains(document.activeElement))refreshR()}

}

function markDirty(){

async function syncNow(){
  if(!dataId||!tokenOk())return;
  if(saving){saveAgain=true;return}
  saving=true;const seq=dirtySeq;const wasDirty=localStorage.getItem('wl-dirty')==='1';
  try{
    const remote=await jget(`${API}/files/${dataId}?alt=media`);
    let merged=mergeDocs(toDoc(),remote);
    if(wasDirty)await gfetch(`${UP}/files/${dataId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)});
    remoteVersion=await getVersion();
    if(seq===dirtySeq)localStorage.removeItem('wl-dirty');
    applyDoc(mergeDocs(toDoc(),merged));
    setSync(seq===dirtySeq?'saved':'saving');
  }catch(e){
    if(e.code==='auth')setSync('signin');else if(e.code==='offline')setSync('offline');else setSync('error');
    if(e.code!=='auth')setTimeout(syncNow,15000);
  }finally{saving=false;if(saveAgain){saveAgain=false;syncNow()}}
}

S.peers=[];

function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<60)return m<=1?'a minute ago':m+' minutes ago';const h=Math.round(m/60);if(h<24)return h===1?'an hour ago':h+' hours ago';const d=Math.round(h/24);return d===1?'yesterday':d+' days ago'}
function presBody(){const l=S.open&&S.looks.get(S.open);return {name:me?me.displayName:'',email:me?me.emailAddress:'',page:S.active,lookId:S.open||null,look:l?(l.title||'Untitled look'):null,at:Date.now()}}

async function sendPresence(force){

  const gap=Date.now()-lastPres;if(gap<(force?2500:25000))return;lastPres=Date.now();
  try{await gfetch(`${UP}/files/${presId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(presBody())})}catch{}

async function readPresence(){

  try{
    const r=await jget(`${API}/files?q=${qs(`'${folderId}' in parents and name contains 'presence-' and trashed=false`)}&fields=files(id,modifiedTime)`);
    const peers=[];
    for(const f of r.files||[]){
      if(f.id===presId)continue;
      let body={};try{body=await jget(`${API}/files/${f.id}?alt=media`)}catch{}
      if(me&&body.email&&body.email===me.emailAddress)continue;
      const at=body.at||Date.parse(f.modifiedTime);

}

/* Sign-in */
let gisReady=null;
function loadGIS(){if(gisReady)return gisReady;gisReady=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=res;sc.onerror=()=>{gisReady=null;rej()};document.head.appendChild(sc)});return gisReady}
const isAppleDevice=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
// iPhones and iPads block Google's sign-in popup, so they use a full-page sign-in instead
const useRedirect=()=>isAppleDevice()||inStandalone();
function redirectUri(){return location.origin+location.pathname.replace(/index\.html$/,'')}
function signInRedirect(choose){
  const st=rid();localStorage.setItem('wl-oauth-state',st);localStorage.setItem('wl-return',S.active||'overview');
  const hint=localStorage.getItem('wl-email')||'';
  const q={client_id:clientId(),redirect_uri:redirectUri(),response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:st};
  if(choose||!hint)q.prompt='select_account';else q.login_hint=hint;
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams(q).toString();
}
function signIn(choose){
  if(!clientId()){gate();return}
  if(useRedirect()){signInRedirect(choose);return}
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){loadGIS().then(()=>signIn(choose)).catch(()=>toast('Could not reach Google. Check your connection.'));return}
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPE,callback:resp=>{
    if(resp.error){toast('Sign-in was cancelled.');return}
    token=resp.access_token;tokenExp=Date.now()+(resp.expires_in||3600)*1000;
    localStorage.setItem('wl-token',JSON.stringify({token,exp:tokenExp}));localStorage.setItem('wl-signed','1');
    connect();
  }});
  const hint=localStorage.getItem('wl-email')||'';
  tokenClient.requestAccessToken(choose||!hint?{prompt:'select_account'}:{prompt:'',hint});
}
if(!useRedirect())setTimeout(()=>loadGIS().catch(()=>{}),300);
async function connect(){
  setSync('connecting');
  try{
    if(folderId&&dataId){try{await getVersion()}catch(e){if(e.code==='auth')throw e;folderId=dataId=null}}
    if(!dataId){const f=await findLookbook();if(f)[folderId,dataId]=f}
    if(!dataId){gate('nofolder');setSync('signin');return}
    localStorage.setItem('wl-folder',folderId);localStorage.setItem('wl-data',dataId);
    try{const cp=await jget(`${API}/files/${dataId}?fields=capabilities(canEdit)`);S.canWrite=!(cp.capabilities&&cp.capabilities.canEdit===false)}catch{}
    document.body.classList.toggle('readonly',!S.canWrite);document.body.classList.toggle('hidecosts',HC());if(HC()&&(S.active==='money'||S.active==='summary'))setPage('home');
    hideGate();await syncNow();startPoll();if(S.canWrite)initPresence();
  }catch(e){if(e.code==='auth'){setSync('signin');gate()}else{setSync('error');toast('Could not reach Google Drive.')}}
}
