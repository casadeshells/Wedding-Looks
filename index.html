<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bako & Made">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFEEDD">
<title>Bako &amp; Made, Wedding Looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EFF0; --mat:#FFFFFF; --ink:#221C22; --muted:#7A7178; --line:#DDD6DA;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --gold:#A8854F; --tape:rgba(214,196,160,.62);
  --shadow:0 1px 2px rgba(34,28,34,.06),0 8px 24px -12px rgba(34,28,34,.18);
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#1B171B; --mat:#272027; --ink:#F1ECEF; --muted:#A79EA5; --line:#3A3239;
  --accent:#86BBA9; --accent-ink:#13201C; --gold:#C9A56E; --tape:rgba(176,141,87,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:300 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:32px 22px 22px;border-right:1px solid var(--line)}
.mark{font-family:var(--display);font-size:38px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.mark-sub{color:var(--muted);font-size:13px;margin:0 0 30px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 10px;border-radius:6px;font-size:15px}
.nav button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.nav button[aria-current="true"]{background:var(--mat);box-shadow:var(--shadow);font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.nav .sum{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav .sep{height:1px;background:var(--line);margin:12px 6px}
.side-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.grand-label{color:var(--muted);font-size:13px}
.grand{font-family:var(--display);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;word-break:break-word}
.cur{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.cur select{background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 6px}

/* Main */
.col{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.col main{flex:1}
.credit{padding:24px clamp(18px,4vw,56px) 28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;letter-spacing:.02em}
main{padding:44px clamp(18px,4vw,56px) 80px;min-width:0;position:relative}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,84px);line-height:.95;margin:0;letter-spacing:-.005em}
.head .meta{color:var(--muted);font-size:14px;margin-top:10px}
.note{max-width:62ch;margin:18px 0 0;padding-left:14px;border-left:2px solid var(--c);color:var(--muted);font-size:15px}
.note b{font-weight:500;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:400}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:#B4413C}
.btn:disabled{opacity:.45;cursor:default}

/* Board (collage) */
.board{columns:3 250px;column-gap:28px}
.look{break-inside:avoid;margin:0 0 34px;display:block;width:100%;text-align:left;background:none;border:0;padding:0;transform:rotate(var(--tilt,0deg));transition:transform .25s ease}
.look:hover,.look:focus-visible{transform:rotate(0deg)}
.mat{position:relative;background:var(--mat);padding:12px 12px 14px;box-shadow:var(--shadow)}
.tape{position:absolute;top:-9px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(var(--tape,-3deg));background:var(--tape);backdrop-filter:blur(1px);z-index:2}
.photo{aspect-ratio:var(--ar,4/5);background:color-mix(in srgb,var(--c) 18%,var(--paper));overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.strip{display:flex;gap:6px;margin-top:8px}
.strip figure{margin:0;position:relative;width:52px}
.strip img{width:52px;height:52px;object-fit:cover}
.strip figcaption{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagsel{position:absolute;top:4px;left:4px;right:4px;width:calc(100% - 8px);font-size:11px;padding:1px 2px;border-radius:3px;border:0;background:var(--mat);}
.tagtxt{position:absolute;top:4px;right:4px;font-size:11px;background:var(--mat);padding:1px 6px;border-radius:3px}
.cap{padding:12px 2px 0}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cap h3{margin:0;font-weight:400;font-size:17px;line-height:1.3}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.swatches{display:flex;gap:5px;margin:8px 0 2px;flex-wrap:wrap}
.sw{width:16px;height:16px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lines{margin:8px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.5}
.lines li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lines span{color:var(--muted)}
.cap-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.status{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status[data-s="Chosen"]{border-color:var(--gold);color:var(--gold)}
.status[data-s="Sourcing"]{border-color:var(--ink);color:var(--ink)}
.status[data-s="Ready"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.slot{break-inside:avoid;margin:0 0 34px;width:100%;border:1.5px dashed var(--line);background:transparent;aspect-ratio:4/5;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.slot strong{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}
.slot:hover{border-color:var(--ink)}

.empty{border:1.5px dashed var(--line);padding:56px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px}

.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 82%,transparent);display:none;place-items:center;z-index:40;pointer-events:none}
.drop.on{display:grid}
.drop div{font-family:var(--display);font-size:40px;border:2px dashed var(--ink);padding:40px 60px;background:var(--mat)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,15,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:60;transform:translateX(100%);transition:transform .28s ease,visibility .28s;visibility:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none;visibility:visible}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.dr-head span{color:var(--muted);font-size:13px}
.dr-body{overflow-y:auto;padding:20px 22px 40px;flex:1}
.field{margin-bottom:18px}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in,textarea.in,select.in{width:100%;background:var(--mat);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-weight:300}
textarea.in{min-height:64px;resize:vertical;line-height:1.45}
.title-in{font-family:var(--display);font-size:30px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;background:var(--mat);overflow:hidden}
.imgs figure img{width:100%;height:100%;object-fit:cover}
.imgs figure .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.imgs figure .ctl button{background:none;border:0;color:#fff;font-size:12px;padding:2px 4px}
.imgs figure.cover{outline:2px solid var(--accent);outline-offset:2px}
.imgs .add{border:1.5px dashed var(--line);background:transparent;aspect-ratio:1;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--mat);border-radius:999px;padding:3px 6px 3px 4px;font-size:12px}
.chip .sw{width:18px;height:18px}
.chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:14px;line-height:1}
.picker{display:flex;align-items:center;gap:6px}
.picker input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;overflow:hidden}
.costs{display:flex;flex-direction:column;gap:8px}
.cost{display:grid;grid-template-columns:1fr 130px 28px;gap:8px;align-items:center}
.cost .x{border:0;background:none;color:var(--muted);font-size:18px}
.cost-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.cost-total b{font-family:var(--display);font-weight:400;font-size:26px}
.dr-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

/* Summary */
.big{font-family:var(--display);font-size:clamp(52px,9vw,110px);line-height:1;margin:6px 0 30px;font-variant-numeric:tabular-nums;word-break:break-word}
.bars{display:flex;flex-direction:column;gap:18px;max-width:760px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:16px;align-items:center;font-size:15px}
.bar{height:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.bar-row .amt{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.sub-h{font-family:var(--display);font-weight:400;font-size:30px;margin:52px 0 16px}
.splits{display:flex;flex-wrap:wrap;gap:14px}
.split{background:var(--mat);box-shadow:var(--shadow);padding:16px 20px;min-width:150px}
.split span{display:block;color:var(--muted);font-size:13px}
.split b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;max-width:900px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:400;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td button{background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.banner{background:var(--mat);border:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:24px;max-width:760px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mobile top bar + menu */
.mbar{display:none;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.hamb{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--mat);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.hamb span{display:block;width:18px;height:1.6px;background:var(--ink);border-radius:2px}
.hamb-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#3BA55C;border:2px solid var(--paper)}
.mb-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;font-size:16px;font-weight:400;text-align:left}
.mb-title span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-title .dot{flex:0 0 10px}
.mb-total{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.navscrim{position:fixed;inset:0;z-index:74;background:rgba(20,15,20,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:22px;border-top:1px solid var(--line)}
.pg{background:none;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left;font-size:16px;min-width:0;max-width:48%}
.pg.next{text-align:right;margin-left:auto}
.pg span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.pg:hover{border-color:var(--ink)}
.dr-cancel{display:inline-flex;align-items:center;gap:6px}
/* ---- v2 features ---- */
.note-in{display:block;width:100%;max-width:62ch;border:0;border-left:2px solid var(--c);background:transparent;font:inherit;font-size:15px;color:var(--muted);padding:2px 0 2px 14px;margin:18px 0 0}
.note-in:hover{color:var(--ink)}
.note-in:focus{outline:none;color:var(--ink);background:var(--mat)}
.news{background:var(--mat);box-shadow:var(--shadow);padding:16px 18px;max-width:720px}
.news-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.news-h .sub-h{margin:0;font-size:26px}
.news-list{display:flex;flex-direction:column}
.news-row{display:block;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.45;width:100%}
.news-row b{font-weight:500}
.news-t{display:block;font-size:12px;color:var(--muted)}
.news-badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:#B4413C;color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}
.hamb-dot.news{background:#B4413C}
.move-to{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--mat);margin-left:auto}
.padd-tile.pal-ai{gap:4px;padding:6px;text-align:center}
.padd-tile.pal-ai .t{font-size:11px;line-height:1.2}
.pp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.pp-c{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--mat);border-radius:10px;padding:8px 12px;text-align:left;font-size:15px}
.pp-c small{color:var(--muted);font-size:12px}
.pp-sw{width:44px;height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pp-c[aria-pressed="false"]{opacity:.45}
.pp-c[aria-pressed="true"]{border-color:var(--ink)}
.share-row select.in{width:auto}
body.readonly [data-add-pics],body.readonly [data-add-blank],body.readonly .drag,body.readonly .edit-pen,body.readonly .padd-tile,body.readonly .prm,body.readonly .vadd,body.readonly [data-vedit],body.readonly .tick-btn,body.readonly .slot,body.readonly [data-pal-pic],body.readonly .aso-pic.up,body.readonly .ai-row,body.readonly .cmt-new,body.readonly .dr-foot,body.readonly [data-cancel],body.readonly .dr-body .btn:not(.wa),body.readonly .add,body.readonly .ctl,body.readonly .x{display:none!important}
body.readonly .psw,body.readonly .heart,body.readonly .tagbtn,body.readonly .vchip,body.readonly .seg button,body.readonly .aso-pic,body.readonly [data-ae-view]{pointer-events:none}
body.readonly .vchip[aria-pressed="false"]{display:none}
body.readonly .tagbtn:not(.has),body.readonly .ai-fab,body.readonly .move-to,body.readonly [data-share],body.readonly #shareIn,body.readonly #shareRole{display:none!important}
/* ---- QoL features ---- */
.drag{position:absolute;top:18px;left:18px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:var(--mat);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:grab;touch-action:none;opacity:0;transition:opacity .15s}
.look:hover .drag,.drag:focus-visible{opacity:1}
@media (hover:none){.drag{opacity:.95}}
.look.dragging{z-index:50;position:relative;transition:none;cursor:grabbing}
.look.dragging .mat{box-shadow:0 24px 48px -12px rgba(0,0,0,.4)}
.look.drop-before .mat{box-shadow:0 -5px 0 var(--accent),var(--shadow)}
.look.drop-after .mat{box-shadow:0 5px 0 var(--accent),var(--shadow)}
.both-love{position:absolute;top:60px;left:18px;z-index:3;background:#B4413C;color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;pointer-events:none}
.card-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.act{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
button.act:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.act.heart.on{color:#B4413C;--hf:#B4413C}
.act.due{color:var(--ink);background:color-mix(in srgb,var(--gold) 18%,transparent);font-size:12px}
.act.due.late{background:color-mix(in srgb,#B4413C 15%,transparent);color:#B4413C}
.owed{display:block;font-family:var(--body);font-size:11px;color:var(--muted);margin-top:1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.filters .in{width:auto;padding:8px 10px;font-size:14px}
.filters input{flex:1 1 200px}
.flt-note{font-size:13px;color:var(--muted);margin:-8px 0 16px}

.sub-h.first{margin-top:0}
.ov{margin-bottom:48px;max-width:900px}
.date-row{display:grid;grid-template-columns:12px minmax(140px,1fr) 180px minmax(60px,auto) 120px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.date-row .amt{text-align:right;font-variant-numeric:tabular-nums}
.mini-pal{display:flex;gap:4px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:400}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.sub-h.sm{font-size:22px;margin-top:40px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:760px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:640px){.chmeta{grid-template-columns:1fr}.date-row{grid-template-columns:12px 1fr auto;row-gap:8px}.date-row .date-in{grid-column:2/4;max-width:none}.date-row .mini-pal{grid-column:2}.date-row .amt{grid-column:3}}
.sync{display:block;margin-top:12px;background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-align:left}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--muted);vertical-align:1px}
.sync[data-st="saved"]::before{background:var(--accent)}
.sync[data-st="signin"],.sync[data-st="error"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sync[data-st="signin"]::before,.sync[data-st="error"]::before{background:#B4413C}
.share-msg{font-size:14px;margin:0 0 10px;min-height:1em}
.people{list-style:none;padding:0;margin:0 0 14px;font-size:14px;display:flex;flex-direction:column;max-width:520px}
.people li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.people li span:first-child{word-break:break-all}
.people .role{color:var(--muted);font-size:13px;white-space:nowrap}
.share-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.share-row .in{max-width:300px}
.gate{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;place-items:center;padding:24px}
.gate.on{display:grid}
.gate-card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;margin:0 0 4px}
.gate-card p{margin:0 0 8px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.col,main{min-width:0;max-width:100vw}
  .head h1{font-size:clamp(38px,11vw,60px)}
  .head{margin-bottom:22px}
  .actions .btn{padding:8px 14px}
  .board{columns:2 150px;column-gap:16px}
  .look{margin-bottom:22px;transform:rotate(calc(var(--tilt,0deg)*.5))}
  .mat{padding:8px 8px 10px}
  .cap h3{font-size:15px}
  .price{font-size:18px}
  .lines{display:none}
  .chmeta{padding:16px 0;margin-bottom:28px}
  .big{font-size:clamp(40px,13vw,64px)}
  .bar-row{grid-template-columns:1fr auto;gap:6px 12px}
  .bar-row .bar{grid-column:1/3;grid-row:2}
  .bar-row .amt{min-width:0}
  .split{min-width:0;flex:1 1 calc(50% - 14px);padding:12px 14px}
  .split b{font-size:20px}
  .credit{padding:18px 16px 24px}
  /* stop iPhone/iPad from zooming in when typing */
  input,select,textarea,.in,.pname,.cp-fields .in,.share-row .in{font-size:16px!important}
  .mbar{display:flex}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:75;background:var(--paper);transform:translateX(-102%);visibility:hidden;transition:transform .26s ease,visibility .26s;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:20px 0 40px -20px rgba(0,0,0,.35)}
  body.nav-open .side{transform:none;visibility:visible}
  body.nav-open .navscrim{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  .side-foot{max-width:none}
  .presence{justify-content:flex-start;text-align:left}
  main{padding-top:28px}
}
@media (max-width:420px){.board{columns:1}.lines{display:block}}
@media (min-width:861px){.side-top{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.look{transform:none}}
</style>
</head>
<body>
<header class="mbar" id="mbar"></header>
<div class="navscrim" id="navScrim"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <div>
        <p class="mark">Bako &amp; Made</p>
        <p class="mark-sub">Our wedding looks</p>
      </div>
      <div class="side-foot" id="sideFootMobile"></div>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="col"><main id="main"></main><footer class="credit">Designed by Casadeshells</footer></div>
</div>
<div class="drop" id="drop"><div>Drop to add looks</div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Edit look"></aside>
<input type="file" id="file" accept="image/*" multiple class="sr" tabindex="-1">
<input type="file" id="aeFile" accept="image/*" class="sr" tabindex="-1">
<input type="file" id="palFile" accept="image/*" class="sr" tabindex="-1">
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Picture viewer" hidden>
  <div class="lb-top"><div><div id="lbTitle" class="lb-title"></div><div id="lbMeta" class="lb-meta"></div></div><button class="lb-close" id="lbClose" aria-label="Close">×</button></div>
  <div class="lb-stage"><button class="lb-nav" id="lbPrev" aria-label="Previous picture">‹</button><img id="lbImg" alt=""><button class="lb-nav" id="lbNext" aria-label="Next picture">›</button></div>
  <div class="lb-bar"><button class="btn primary" id="lbEdit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg> Edit details</button></div>
</div>
<button class="ai-fab" id="aiFab" aria-label="Ask the stylist"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></svg><span>Ask the stylist</span></button>
<div class="ai-scrim" id="aiScrim"></div>
<aside class="ai" id="ai" role="dialog" aria-label="Wedding stylist chat" aria-hidden="true">
  <div class="ai-head"><div><div class="ai-title"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></svg> Stylist</div><div class="ai-sub" id="aiSub">Knows your looks, colors, dates and costs</div></div><div class="ai-head-btns"><button class="btn small ghost" id="aiClear">Clear</button><button class="lb-close ai-x" id="aiClose" aria-label="Close">×</button></div></div>
  <div class="ai-msgs" id="aiMsgs" aria-live="polite"></div>
  <div class="ai-chips" id="aiChips"></div>
  <form class="ai-form" id="aiForm"><textarea id="aiIn" class="in" rows="1" placeholder="Ask about outfits, colors, budget…" aria-label="Message"></textarea><button class="btn primary" id="aiSend" type="submit">Send</button></form>
</aside>
<div class="cp-scrim" id="ppScrim"></div>
<div class="cp" id="pp" role="dialog" aria-modal="true" aria-labelledby="ppTitle" hidden>
  <h2 id="ppTitle">Colors from your picture</h2>
  <p class="tg-hint">Tap to choose which to add.</p>
  <div class="pp-list" id="ppList"></div>
  <div class="cp-actions"><span class="sp"></span><button type="button" class="btn" id="ppCancel">Cancel</button><button type="button" class="btn primary" id="ppOk">Add to palette</button></div>
</div>
<div class="cp-scrim" id="vdScrim"></div>
<div class="cp" id="vd" role="dialog" aria-modal="true" aria-labelledby="vdTitle" hidden>
  <h2 id="vdTitle">New vendor</h2>
  <div class="vd-fields">
    <label>Name<input id="vdName" class="in" placeholder="e.g. Ade Tailoring" maxlength="60"></label>
    <label>Role<input id="vdRole" class="in" list="vdRoles" placeholder="e.g. Tailor" maxlength="40"></label>
    <datalist id="vdRoles"><option>Tailor</option><option>Fashion designer</option><option>Fabric seller</option><option>Cobbler</option><option>Gele stylist</option><option>Makeup artist</option><option>Hair stylist</option><option>Jeweler</option><option>Photographer</option></datalist>
    <label>Phone (with country code)<input id="vdPhone" class="in" type="tel" placeholder="+234 803 123 4567" maxlength="30"></label>
    <label>Notes<textarea id="vdNotes" class="in" rows="2" placeholder="Prices, address, anything useful"></textarea></label>
  </div>
  <div class="cp-actions"><button type="button" class="btn small danger" id="vdDel">Delete</button><span class="sp"></span><button type="button" class="btn" id="vdCancel">Cancel</button><button type="button" class="btn primary" id="vdSave">Save</button></div>
</div>
<div class="cp-scrim" id="tgScrim"></div>
<div class="cp tg" id="tg" role="dialog" aria-modal="true" aria-labelledby="tgTitle" hidden>
  <h2 id="tgTitle">Who is this for?</h2>
  <p class="tg-hint">Pick one or more.</p>
  <div class="tg-opts" id="tgOpts"></div>
  <div class="cp-actions"><button type="button" class="btn small ghost" id="tgClear">Clear</button><span class="sp"></span><button type="button" class="btn" id="tgCancel">Cancel</button><button type="button" class="btn primary" id="tgOk">OK</button></div>
</div>
<div class="cp-scrim" id="cpScrim"></div>
<div class="cp" id="cp" role="dialog" aria-modal="true" aria-labelledby="cpTitle" hidden>
  <h2 id="cpTitle">Choose a color</h2>
  <div class="cp-prev"><span id="cpSw"></span><div class="cp-fields"><label id="cpNameWrap">Name<input id="cpName" class="in" placeholder="e.g. Wine" maxlength="24"></label><label>Hex code<input id="cpHex" class="in" maxlength="7" spellcheck="false"></label></div></div>
  <div class="cp-grid" id="cpGrid"></div>
  <label class="cp-custom"><span class="cp-rainbow"><input type="color" id="cpNative" aria-label="Custom color"></span>Pick any color</label>
  <div class="cp-actions"><button type="button" class="btn small danger" id="cpDel">Remove</button><span class="sp"></span><button type="button" class="btn" id="cpCancel">Cancel</button><button type="button" class="btn primary" id="cpOk">OK</button></div>
</div>

<script>
const CH=[
 {id:'court',name:'Court wedding',color:'#8FA3B3',note:'Simple, tailored looks for the registry.'},
 {id:'prewedding',name:'Pre-wedding shoot',color:'#9DAE8C',slots:3,note:'Three outfits for the photo shoot.'},
 {id:'introduction',name:'Introduction',color:'#C7899B',note:'Family-coordinated colors and attire.'},
 {id:'traditional',name:'Traditional marriage',color:'#7A2E3A',note:'Traditional attire, beads and accessories.'},
 {id:'church',name:'Church wedding',color:'#CDBFA8',note:'Gown, suit and veil.'}
];
const FIELDS=[['outfit','Outfit & fabric'],['accessories','Accessories'],['shoes','Shoes'],['beauty','Hair & makeup'],['notes','Notes']];
const WHO=['Bride','Groom','Both','Best man','Maid of honor','Groomsmen','Bridesmaids','Family'];
const TAGS=['Bride','Groom','Best man','Maid of honor','Groomsmen','Bridesmaids','Family'];
const STATUS=['Idea','Chosen','Sourcing','Ready'];
const CURS={NGN:'Naira (₦)',EUR:'Euro (€)',USD:'Dollar ($)',GBP:'Pound (£)'};
const DEFAULT_COSTS=[{label:'Outfit',amount:''},{label:'Shoes',amount:''},{label:'Accessories',amount:''}];

const S={overview:{palette:[]},chapters:{},looks:new Map(),currency:'NGN',active:'overview',open:null,mode:'local',canWrite:true,canUpload:true};
S.chapters=Object.fromEntries(CH.map(c=>[c.id,{palette:[],date:''}]));
const metaObj=k=>k==='overview'?S.overview:S.chapters[k];
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'})};
const D={deleted:{}};S.vendors={};S.comments={};S.hearts={};S.flt={q:'',status:'',person:'',fav:''};S.gq='';S.mode='drive';S.sync='signin';S.settingsAt=0;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const lookTotal=l=>(l.costs||[]).reduce((a,c)=>a+num(c.amount),0);
const lineOwed=r=>r.status==='paid'?0:r.status==='deposit'?Math.max(0,num(r.amount)-num(r.paid)):num(r.amount);
const lookOwed=l=>(l.costs||[]).reduce((a,r)=>a+lineOwed(r),0);
const lookPaid=l=>lookTotal(l)-lookOwed(l);
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const daysUntil=d=>{if(!d)return null;const t=new Date(d+'T00:00:00');if(isNaN(t))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)};
const cdText=n=>n==null?'':n===0?'Today':n===1?'Tomorrow':n>1?`in ${n} days`:n===-1?'Yesterday':`${-n} days ago`;
const shortDate=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const myId=()=>((typeof me!=='undefined'&&me&&me.emailAddress)||localStorage.getItem('wl-email')||'me').toLowerCase();
const myName=()=>{const n=(typeof me!=='undefined'&&me&&me.displayName)||'';return (n.split(' ')[0])||myId().split('@')[0]};
const heartsFor=id=>Object.values(S.hearts||{}).filter(h=>h&&h.lookId===id&&h.on);
const iLove=id=>!!((S.hearts||{})[id+'~'+myId()]||{}).on;
const commentsFor=id=>Object.entries(S.comments||{}).filter(([,c])=>c&&c.lookId===id).map(([cid,c])=>({cid,...c})).sort((a,b)=>a.at-b.at);
const lookFor=(l,person)=>l.who===person||(l.who==='Both'&&(person==='Bride'||person==='Groom'))||(l.images||[]).some(im=>tagsOf(l,im).includes(person));
const waNum=ph=>{let d=String(ph||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);d=d.replace(/\D/g,'');if(d.startsWith('00'))return d.slice(2);if(d.startsWith('0')&&d.length===11)return '234'+d.slice(1);return d};
function lookMatches(l,f){
  if(f.status&&(l.status||'Idea')!==f.status)return false;
  if(f.person&&!lookFor(l,f.person))return false;
  if(f.fav==='me'&&!iLove(l._id||''))return false;
  if(f.fav==='both'&&heartsFor(l._id||'').length<2)return false;
  const q=(f.q||'').trim().toLowerCase();if(!q)return true;
  const c=CH.find(x=>x.id===l.chapter);
  const vend=(l.vendors||[]).map(v=>(S.vendors[v]||{}).name||'').join(' ');
  const tags=(l.images||[]).flatMap(im=>tagsOf(l,im)).join(' ');
  const pal=[...((S.chapters[l.chapter]||{}).palette||[])].filter(p=>(l.colors||[]).map(x=>x.toLowerCase()).includes(String(p.hex).toLowerCase())).map(p=>p.name).join(' ');
  const hay=[l.title,l.who,l.status,l.outfit,l.accessories,l.shoes,l.beauty,l.notes,(l.colors||[]).join(' '),c&&c.name,vend,tags,pal].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
function money(n){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:S.currency,currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(n)}catch{return S.currency+' '+Math.round(n).toLocaleString('en-US')}}
const tagsOf=(l,id)=>{const v=(l.imageTags||{})[id];return Array.isArray(v)?v:(v?[v]:[])};
const tagOf=(l,id)=>tagsOf(l,id).join(', ');
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const urlCache=new Map();
const imgAttr=id=>`data-img="${esc(id)}" src="${urlCache.get(id)||BLANK}"`;
const byChapter=ch=>[...S.looks.entries()].map(([id,l])=>({id,_id:id,...l})).filter(l=>l.chapter===ch).sort((a,b)=>(a.order||0)-(b.order||0));
const chTotal=ch=>byChapter(ch).reduce((a,l)=>a+lookTotal(l),0);
const grandTotal=()=>[...S.looks.values()].filter(l=>l.chapter!=='inbox').reduce((a,l)=>a+lookTotal(l),0);
const cnote=k=>{const m=(S.chapters||{})[k]||{};return m.note!=null?m.note:((CH.find(c=>c.id===k)||{}).note||'')};
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- Render ---------- */
function renderSide(){
  const items=CH.map(c=>`<li><button data-nav="${c.id}" style="--c:${c.color}" aria-current="${S.active===c.id}"><span class="dot"></span><span>${c.name}</span><span class="sum">${byChapter(c.id).length||''}</span></button></li>`).join('');
  const nn=newsItems().length;
  $('#nav').innerHTML=`<li><button data-nav="overview" style="--c:var(--gold)" aria-current="${S.active==='overview'}"><span class="dot"></span><span>Overview</span><span class="sum">${nn?`<i class="news-badge">${nn}</i>`:''}</span></button></li>`+items+`<li class="sep" aria-hidden="true"></li><li><button data-nav="inbox" style="--c:var(--muted)" aria-current="${S.active==='inbox'}"><span class="dot"></span><span>Ideas inbox</span><span class="sum">${byChapter('inbox').length||''}</span></button></li><li><button data-nav="summary" style="--c:var(--ink)" aria-current="${S.active==='summary'}"><span class="dot"></span><span>Cost summary</span><span class="sum"></span></button></li>`;
  const foot=`<div class="grand-label">Total for all looks</div><div class="grand">${money(grandTotal())}</div>
    ${presenceHTML()}${syncChip()}${acctHTML()}<button class="btn small" data-pdf style="margin-top:8px">Export PDF</button>${showInstall()?`<button class="btn small" data-install style="margin-top:8px;margin-left:6px">Install app</button>`:''}
    <label class="cur">Currency <select id="curSel" ${S.canWrite?'':'disabled'}>${Object.entries(CURS).map(([k,v])=>`<option value="${k}" ${k===S.currency?'selected':''}>${v}</option>`).join('')}</select></label>`;
  $('#sideFoot').innerHTML=foot;$('#sideFootMobile').innerHTML='';
  const cur=S.active==='overview'?{name:'Overview',color:'var(--gold)'}:S.active==='summary'?{name:'Cost summary',color:'var(--ink)'}:S.active==='inbox'?{name:'Ideas inbox',color:'var(--muted)'}:CH.find(c=>c.id===S.active);
  const on=(S.peers||[]).some(p=>p.online);
  $('#mbar').innerHTML=`<button class="hamb" data-menu aria-label="Open menu" aria-expanded="${document.body.classList.contains('nav-open')}"><span></span><span></span><span></span>${on?'<i class="hamb-dot" title="Your partner is online"></i>':nn?'<i class="hamb-dot news" title="New activity"></i>':''}</button>
    <button class="mb-title" data-menu><span class="dot" style="--c:${cur.color}"></span><span>${esc(cur.name)}</span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <span class="mb-total">${money(grandTotal())}</span>`;
}

function cardHTML(l,i){
  const c=CH.find(x=>x.id===l.chapter)||(l.chapter==='inbox'?INBOX:CH[0]);
  const h=hash(l.id);const tilt=((h%7)-3)*0.35;const tape=((h>>3)%9)-4;
  const imgs=l.images||[];
  const lines=FIELDS.filter(([k])=>l[k]).slice(0,3).map(([k,lab])=>`<li><span>${lab}.</span> ${esc(l[k])}</li>`).join('');
  const sw=(l.colors||[]).map(s=>`<i class="sw" style="--s:${esc(s)}"></i>`).join('');
  const total=lookTotal(l);
  return `<article class="look" data-look="${l.id}" style="--tilt:${tilt}deg;--tape:${tape}deg;--c:${c.color};--ar:${i%3===1?'3/4':'4/5'}">
    <div class="mat"><span class="tape"></span>
      <button class="drag" aria-label="Drag to reorder" title="Drag to reorder"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></svg></button>
      ${heartsFor(l.id).length>=2?'<span class="both-love">♥ Both love it</span>':''}
      <button class="edit-pen" data-open="${l.id}" aria-label="Edit look"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="photo" ${imgs[0]?`data-view="${l.id}|0" aria-label="View pictures"`:`data-open="${l.id}" aria-label="Add a picture"`}>${imgs[0]?`<img ${imgAttr(imgs[0])} alt="${esc(l.title||'Outfit idea')}" loading="lazy">`:`<div class="ph">No picture yet.<br>Open to add one.</div>`}

/* ---------- Images ---------- */
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.86));
  }catch{return file}
}
async function storeImage(file){
  if(!folderId||!tokenOk())throw {code:'auth'};
  const b=await shrink(file);
  const id=await createFile({name:'look-'+Date.now()+'.jpg',parents:[folderId]},b);
  urlCache.set(id,URL.createObjectURL(b));cachePut(id,b);return id;
}
let pendingTarget=null;
async function addImages(files,{lookId=null,chapter=S.active}={}){
  files=[...files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));
  if(!files.length)return;
  if(!folderId||!tokenOk()){toast('Sign in with Google to add pictures.');return}
  if(!S.canWrite){toast('You have view-only access.');return}
  if(chapter==='summary'||chapter==='overview'){if(!lookId){chapter='inbox';toast('Added to your Ideas inbox')}else chapter='court'}
  toast(files.length>1?`Adding ${files.length} pictures`:'Adding picture');
  let made=null,autoFillTarget=null;
  for(const f of files){
    try{
      const imgId=await storeImage(f);
      if(lookId){const had=((S.looks.get(lookId)||{}).images||[]).length;change(lookId,l=>{l.images=[...(l.images||[]),imgId]},{redrawDrawer:true});if(!had&&!autoFillTarget)autoFillTarget=lookId}
      else{made=newLook(chapter,[imgId]);render()}
    }catch(e){handleErr(e)}
  }
  if(made&&files.length===1){openDrawer(made,true);aiFill(made,{auto:true})}
  else if(autoFillTarget&&S.open===autoFillTarget)aiFill(autoFillTarget,{auto:true});
}

let cdb=null;

const loadingImg=new Map();
function ensureImg(id){
  if(urlCache.has(id))return Promise.resolve(urlCache.get(id));
  if(loadingImg.has(id))return loadingImg.get(id);
  const p=(async()=>{try{
    let b=await cacheGet(id);
    if(!b){if(!tokenOk())return null;b=await (await gfetch(`${API}/files/${id}?alt=media`)).blob();cachePut(id,b)}
    const u=URL.createObjectURL(b);urlCache.set(id,u);
    document.querySelectorAll('img[data-img]').forEach(i=>{if(i.dataset.img===id)i.src=u});return u;
  }catch{return null}finally{loadingImg.delete(id)}})();
  loadingImg.set(id,p);return p;
}

function toDoc(){const looks={};for(const [id,l] of S.looks)looks[id]=l;return {v:1,looks,deleted:D.deleted,overview:S.overview,chapters:S.chapters,settings:{currency:S.currency,updatedAt:S.settingsAt||0},vendors:S.vendors,comments:S.comments,hearts:S.hearts}}

function newer(x,y){return !x?y:!y?x:((x.updatedAt||0)>=(y.updatedAt||0)?x:y)}
function mergeDocs(a,b){
  b=b||{};const out={v:1,looks:{},deleted:{...(b.deleted||{})},chapters:{}};
  for(const [k,t] of Object.entries(a.deleted||{}))out.deleted[k]=Math.max(t,out.deleted[k]||0);
  const ids=new Set([...Object.keys(a.looks||{}),...Object.keys(b.looks||{})]);
  for(const id of ids){const w=newer((a.looks||{})[id],(b.looks||{})[id]);if((out.deleted[id]||0)>=(w.updatedAt||0))continue;out.looks[id]=w}
  out.overview=newer(a.overview,b.overview);out.settings=newer(a.settings,b.settings);
  for(const c of CH)out.chapters[c.id]=newer((a.chapters||{})[c.id],(b.chapters||{})[c.id]);
  out.vendors=mergeMap(a.vendors,b.vendors,'v:',out.deleted);out.comments=mergeMap(a.comments,b.comments,'c:',out.deleted);out.hearts=mergeMap(a.hearts,b.hearts,'',out.deleted);
  return JSON.parse(JSON.stringify(out));

  AI_FILLING=id;refreshDrawer();
  try{
    const c=CH.find(x=>x.id===l.chapter)||{name:'wedding'};
    const pal=((S.chapters[l.chapter]||{}).palette||[]).concat(S.overview.palette||[]).map(p=>`${p.name||''} ${p.hex}`).join(', ');
    const prompt=`This picture is outfit inspiration for the ${c.name} of a Nigerian couple's wedding (bride Bako, groom Made).${pal?` Their colors: ${pal}.`:''}
Describe what you see for their lookbook. Reply with JSON only, no other text, using exactly these keys:
{"title":"2 to 4 word name for the look","who":"one of ${WHO.join(', ')}","tags":["any of ${TAGS.join(', ')} the outfit suits"],"outfit":"fabric, cut and style, max 15 words","accessories":"jewelry, headwear, bag, max 12 words","shoes":"style and color, max 8 words, empty if not visible","beauty":"hair, gele or makeup, max 10 words, empty if not visible","colors":[{"name":"color name","hex":"#RRGGBB"}]}
Use up to 4 main colors. Use "" for anything you cannot see. No em dashes.`;
    const b64=await imgB64(l.images[0]);
    const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({json:true,system:'You describe wedding outfit photos for a lookbook. Reply with valid JSON only.',messages:[{role:'user',text:prompt,images:[{mime:'image/jpeg',data:b64}]}]})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)throw new Error(d.error||('error '+r.status));
    let j;try{j=JSON.parse(String(d.text).replace(/```json|```/g,'').trim())}catch{throw new Error('The AI helper needs the latest worker.js in Cloudflare.')}
    if(!S.looks.has(id))return;
    const str=v=>typeof v==='string'?v.trim().slice(0,200):'';
    change(id,x=>{
      if(!x.title&&str(j.title))x.title=str(j.title);
      for(const k of ['outfit','accessories','shoes','beauty'])if(!x[k]&&str(j[k]))x[k]=str(j[k]);
      if(!(x.colors||[]).length&&Array.isArray(j.colors))x.colors=j.colors.map(c=>normHex(c&&c.hex)).filter(Boolean).slice(0,4);
      if(WHO.includes(j.who)&&(DR&&DR.isNew&&DR.id===id||!x.who||x.who==='Both'))x.who=j.who;
      const im=x.images[0];const tg=Array.isArray(j.tags)?j.tags.filter(t=>TAGS.includes(t)):[];
      if(im&&tg.length&&!tagsOf(x,im).length)x.imageTags={...(x.imageTags||{}),[im]:tg};
    });
    toast('Filled in from the picture. Check and adjust anything.');
  }catch(e){if(!auto||!/sign/i.test(e.message))toast(e.message&&e.message.length<120?e.message:'Could not read the picture. Try again.')}
  finally{AI_FILLING=null;refreshDrawer()}
}

/* ---------- Install as an app ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showInstall(){return !isStandalone()&&(!!installEvt||isIOS())}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;renderSide()});
addEventListener('appinstalled',()=>{installEvt=null;renderSide();toast('Installed')});
async function installApp(){
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch{}installEvt=null;renderSide();return}
  if(isIOS())toast(/CriOS|EdgiOS|FxiOS/.test(navigator.userAgent)?'Tap the Share icon in the address bar, then “Add to Home Screen”.':'Tap the Share button, then “Add to Home Screen”.');
}
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

/* ---------- Back gesture closes open panels ---------- */
const OV=[];let skipPop=0;
function pushOverlay(name){try{history.pushState({ov:name},'',location.href);OV.push(name)}catch{}}
function dropOverlay(name){const i=OV.lastIndexOf(name);if(i>=0)OV.splice(i,1)}
function popOverlay(name){const i=OV.lastIndexOf(name);if(i<0)return;OV.splice(i,1);skipPop++;try{history.back()}catch{skipPop--}}

/* ---------- Remember the current page ---------- */
const PAGES=['overview','summary','inbox',...CH.map(c=>c.id)];
function setPage(pg,push){
  if(!PAGES.includes(pg))pg='overview';S.active=pg;
  try{localStorage.setItem('wl-page',pg)}catch{}
  const h='#'+pg;try{if(location.hash!==h){if(push)history.pushState(null,'',h);else history.replaceState(null,'',h)}}catch{}
}
addEventListener('popstate',()=>{
  if(skipPop>0){skipPop--;return}
  if(OV.length){const top=OV.pop();
    if(top==='pp')closePalPick(true);else if(top==='vd')closeVendor(true);else if(top==='ai')closeAI(true);else if(top==='cp')closePicker(true);else if(top==='tg')closeTags(true);else if(top==='lb')closeLightbox(true);else if(top==='drawer')closeDrawer(true);else if(top==='menu')toggleMenu(false,true);
    return}
  const pg=location.hash.slice(1);
  if(PAGES.includes(pg)&&pg!==S.active){S.active=pg;try{localStorage.setItem('wl-page',pg)}catch{}closeDrawer(true);toggleMenu(false,true);render();window.scrollTo({top:0})}
});
(()=>{const h=location.hash.slice(1);setPage(PAGES.includes(h)?h:(localStorage.getItem('wl-page')||'overview'),false)})();

/* ---------- Init ---------- */
try{const d=JSON.parse(localStorage.getItem('wl-doc')||'null');if(d)applyDoc(d)}catch{}
render();
if(!clientId())gate();
else if(tokenOk())connect();
else gate();
</script>
